// Responsive letterboxed HiDPI sizing
let viewScale = 1;
function resizeCanvas() {
  const dpr = Math.min(2.5, window.devicePixelRatio || 1);
  const availW = window.innerWidth;
  const availH = window.innerHeight;
  viewScale = Math.min(availW / VW, availH / VH);
  const cssW = Math.floor(VW * viewScale);
  const cssH = Math.floor(VH * viewScale);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  // Render buffer matches real physical screen pixels (zero CSS upscaling blur!)
  canvas.width = Math.floor(cssW * dpr);
  canvas.height = Math.floor(cssH * dpr);
  ctx.setTransform(viewScale * dpr, 0, 0, viewScale * dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
}
window.addEventListener('resize', resizeCanvas);

}

  sfx[sid] = a;
}

function playSfx(name) {
  if (G.muted) return;
  const base = sfx[name];
  if (!base) return;
  try {
    const inst = base.cloneNode(true);
    inst.volume = 0.55;
    inst.play().catch(() => {});
  } catch (_) {}
}

function addTrauma(a) { G.trauma = Math.min(0.65, G.trauma + a * 0.45); }
function spawnVfxSprite(imgId, x, y, w, h, duration) {
  if (!G.vfxSprites) G.vfxSprites = [];
  G.vfxSprites.push({ img: imgId, x, y, w, h, life: duration, maxLife: duration });
}
function spawnParticles(x, y, count, r, g, b, spd, grav, rMin, rMax) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = spd * (0.35 + Math.random() * 0.85);
    const life = 0.28 + Math.random() * 0.42;
    G.particles.push({
      x: x + (Math.random() - 0.5) * 16, y: y + (Math.random() - 0.5) * 16,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 95,
      rad: rMin + Math.random() * (rMax - rMin), r, g, b, life, maxLife: life, grav
    });
  }
}
function spawnFloat(x, y, text, r, g, b, size, life = 1.05, isBubble = false) {
  G.floats.push({ x, y, vy: isBubble ? -32 : -68, text, r, g, b, size, life, maxLife: life, isBubble });
}
function spawnShockwave(x, y, maxRad, r, g, b, dur, groundOnly = false) {
  G.waves.push({ x, y, rad: 18, maxRad, r, g, b, life: dur, maxLife: dur, groundOnly });
}
function spawnPickup(kind, x, y, val) {
  G.pickups.push({ kind, x, y, vy: -220 - Math.random() * 90, val, life: 7.5, maxLife: 7.5 });

function calmZombie(z) {

  G.comboT = 3.8; G.totalCalmed++; G.calmedInLevel++;
  G.nazar = Math.min(100, G.nazar + (z.isBoss ? 45 : 10));
  const mult = 1 + Math.min(4, Math.floor(G.combo / 3));
  const pts = z.reward * 10 * mult;
  G.score += pts; if (G.score > G.bestScore) G.bestScore = G.score;

function buyUpgrade(upId) {
  const u = UPGRADES.find(x => x.id === upId);
  if (!u) return;
  const lvl = G.upLevels[upId] || 0;
  if (lvl >= u.maxLvl) return;
  const cost = u.baseCost + lvl * 38;
  if (G.gold < cost) { playSfx('sfx_hit'); return; }
  G.gold -= cost; G.upLevels[upId] = lvl + 1; playSfx('sfx_coin');
  if (upId === 'ayran_dmg') G.ayranDmg += 12;
  else if (upId === 'belt_cap') { G.maxAyran += 4; G.ayran = G.maxAyran; }
  else if (upId === 'kolonya_pow') { G.kolonyaDmg += 22; G.kolonyaRange += 24; G.kolonyaMaxCd = Math.max(1.3, G.kolonyaMaxCd - 0.22); }
  else if (upId === 'tea_heal') { G.maxHp += 15; G.hp = Math.min(G.maxHp, G.hp + 55); }
}

function updateZombieAI(z, dt) {
  const dx = G.px - z.x;
  const dist = Math.abs(dx);
  const dir = dx >= 0 ? 1 : -1;
  const wetMul = z.wetT > 0 ? 0.65 : 1.0;

  if (z.isBoss) {
    z.aiCd -= dt;
    if (z.aiState === 'channel') {
      z.aiTimer -= dt; z.facing = dir;
      if (Math.random() < 0.35) spawnParticles(z.x, z.y - 110, 1, 110, 255, 145, 110, -80, 4, 8);
      if (z.aiTimer <= 0) {
        z.hp = Math.min(z.maxHp, z.hp + 115); z.aiState = 'chase'; z.aiCd = 6.2; playSfx('sfx_calm');
        spawnFloat(z.x, z.y - 230, 'AÇIK BÜFE +115 CAN!', 120, 255, 150, 24, 1.3);
      }
      return;
    } else if (z.aiState === 'telegraph') {
      z.aiTimer -= dt; z.facing = dir;
      if (z.aiTimer <= 0) {
        if (z.bossSpecial === 'quake') {
          addTrauma(0.72); playSfx('sfx_prop');
          spawnShockwave(z.x, GROUND_Y - 12, 460, 255, 95, 75, 0.55, true);
          spawnParticles(z.x, GROUND_Y - 10, 26, 255, 145, 75, 320, 420, 5, 10);
          if (G.py >= GROUND_Y - 22 && dist < 440) hurtPlayer(20, dir);
          z.aiState = 'chase'; z.aiCd = 4.5;
        } else if (z.bossSpecial === 'hamsi') {
          playSfx('sfx_throw');
          for (const vyOff of [-240, -110, 20]) {
            G.enemyProjs.push({ x: z.x + z.facing * 55, y: z.y - 120, vx: z.facing * 430, vy: vyOff, rot: 0, dmg: 15, label: 'HAMSİ', img: 'proj_hamsi', life: 2.4, r: 110, g: 215, b: 255 });
          }
          z.aiState = 'chase'; z.aiCd = 3.8;
        }
      }
      return;
    } else if (z.aiCd <= 0 && dist < 560) {
      if (z.bossSpecial === 'buffet' && z.hp < z.maxHp * 0.7) {
        z.aiState = 'channel'; z.aiTimer = 2.6; z.channelHits = 0; playSfx('sfx_horn');
        spawnFloat(z.x, z.y - 245, 'AÇIK BÜFE ŞİFASI! DURDUR!', 125, 255, 150, 22, 1.5);
        return;
      } else if (z.bossSpecial === 'quake' || z.bossSpecial === 'hamsi') {
        z.aiState = 'telegraph'; z.aiTimer = 0.75; playSfx('sfx_horn');
        spawnFloat(z.x, z.y - 245, z.bossSpecial === 'quake' ? 'DEPREM GELİYOR! ZIPLA!' : 'HAMSİ YAĞMURU!', 255, 110, 95, 22, 1.0);
        return;
      }
    }
  }

  z.aiCd -= dt;
  if (z.ai === 'dasher') {
    if (z.aiState === 'telegraph') {
      z.aiTimer -= dt;
      if (z.aiTimer <= 0) {
        z.aiState = 'action'; z.aiTimer = 0.56; z.vx = z.facing * 490 * wetMul;
        spawnParticles(z.x, z.y - 18, 10, 255, 220, 110, 180, 140, 4, 8);
      }
      return;
    } else if (z.aiState === 'action') {
      z.aiTimer -= dt; z.x += z.vx * dt;
      if (Math.random() < 0.4) spawnParticles(z.x - z.facing * 26, z.y - 12, 1, 255, 215, 120, 70, 60, 4, 7);
      if (dist < 56 && Math.abs(G.py - z.y) < 68) hurtPlayer(z.dmg, z.facing);
      if (z.aiTimer <= 0) { z.aiState = 'chase'; z.aiCd = 2.6; }
      return;
    } else if (z.aiCd <= 0 && dist > 165 && dist < 430) {
      z.facing = dir; z.aiState = 'telegraph'; z.aiTimer = 0.62; playSfx('sfx_horn');
      spawnFloat(z.x, z.y - 175, 'BİP BİP! DEPAR!', 255, 220, 80, 17, 0.75);
      return;
    }
  } else if (z.ai === 'ranged') {
    z.facing = dir;
    if (z.aiState === 'telegraph') {
      z.aiTimer -= dt;
      if (z.aiTimer <= 0) {
        playSfx('sfx_throw');
        G.enemyProjs.push({ x: z.x + z.facing * 32, y: z.y - 98, vx: z.facing * 395, vy: -125, rot: 0, dmg: z.dmg, label: z.projLabel, img: z.projImg, life: 2.2, r: 255, g: 190, b: 85 });
        z.aiState = 'chase'; z.aiCd = 2.6 + Math.random() * 0.8;
      }
      return;
    } else {
      if (dist < 175 && z.aiCd < 1.2) z.x -= dir * z.speed * 1.15 * wetMul * dt;
      else if (dist > 380) z.x += dir * z.speed * wetMul * dt;
      else if (z.aiCd <= 0) {
        z.aiState = 'telegraph'; z.aiTimer = 0.5;
        spawnFloat(z.x, z.y - 170, `${z.projLabel} GELİYOR!`, 255, 195, 95, 16, 0.65);
      }
      z.x += z.vx * dt;
      return;
    }
  } else if (z.ai === 'heavy' && !z.isBoss) {
    if (z.aiState === 'telegraph') {
      z.aiTimer -= dt;
      if (z.aiTimer <= 0) {
        playSfx('sfx_prop'); spawnParticles(z.x + z.facing * 45, z.y - 75, 10, 255, 110, 95, 190, 240, 4, 8);
        if (dist < 118 && Math.abs(G.py - z.y) < 75) hurtPlayer(z.dmg, z.facing);
        z.aiState = 'chase'; z.aiCd = 1.65;
      }
      return;
    } else if (dist < 96 && z.aiCd <= 0) {
      z.facing = dir; z.aiState = 'telegraph'; z.aiTimer = 0.54;
      spawnFloat(z.x, z.y - 180, 'SAVURUYOR!', 255, 100, 100, 17, 0.6);
      return;
    }
  } else if (z.ai === 'flyer') {
    z.facing = dir; z.y = z.baseY + Math.sin(z.animT * 3.4) * 20;
    z.x += (dist > 110 ? (dir * z.speed * wetMul + z.vx) : z.vx) * dt;
    if (z.aiCd <= 0 && dist < 340) {
      z.aiCd = 2.8;
      G.enemyProjs.push({ x: z.x, y: z.y - 45, vx: dir * 220, vy: 60, rot: 0, dmg: z.dmg, label: z.projLabel, img: z.projImg, life: 2.0, r: 255, g: 125, b: 215 });
    }
    if (dist < 56 && Math.abs(G.py - z.y) < 88) {
      z.atkCd -= dt; if (z.atkCd <= 0) { z.atkCd = 1.2; hurtPlayer(z.dmg, dir); }
    }
    return;
  }

  z.facing = dir;
  const stopDist = z.isBoss ? 82 : 54;
  if (dist > stopDist) {
    z.x += (z.facing * z.speed * wetMul + z.vx) * dt;
    z.aiState = 'chase';
  } else {
    z.x += z.vx * dt;
    z.atkCd -= dt;
    if (z.aiState !== 'windup' && z.atkCd <= 0) {
      z.aiState = 'windup';
      z.aiTimer = 0.36; // Telegraph warning window!
      spawnFloat(z.x, z.y - 170, '!', 255, 80, 80, 24, 0.38);
    }
    if (z.aiState === 'windup') {
      z.aiTimer -= dt;
      if (z.aiTimer <= 0) {
        z.aiState = 'chase';
        z.atkCd = z.isBoss ? 1.05 : 1.35;
        if (Math.abs(G.py - z.y) < 72 && dist < stopDist + 18) {
          hurtPlayer(z.dmg, z.facing);
        }
      }
    }
  }
}

function updatePlay(dt) {
  G.shakeClock += dt * 36;
  if (G.trauma > 0) G.trauma = Math.max(0, G.trauma - dt * 1.45);
  G.heroSX += (1 - G.heroSX) * Math.min(1, dt * 14);
  G.heroSY += (1 - G.heroSY) * Math.min(1, dt * 14);
  if (G.hitStop > 0) { G.hitStop -= dt; return; }

  const lvl = LEVELS[G.levelIdx];
  if (G.kolonyaCd > 0) G.kolonyaCd = Math.max(0, G.kolonyaCd - dt);
  if (G.kolonyaVfxT > 0) G.kolonyaVfxT = Math.max(0, G.kolonyaVfxT - dt);
  if (G.nazarAnimT > 0) G.nazarAnimT = Math.max(0, G.nazarAnimT - dt);
  if (G.throwAnimT > 0) G.throwAnimT = Math.max(0, G.throwAnimT - dt);
  if (G.hitAnimT > 0) G.hitAnimT = Math.max(0, G.hitAnimT - dt);
  if (G.invulnT > 0) G.invulnT = Math.max(0, G.invulnT - dt);
  if (G.bossBannerT > 0) G.bossBannerT = Math.max(0, G.bossBannerT - dt);
  if (G.dropThroughT > 0) G.dropThroughT = Math.max(0, G.dropThroughT - dt);
  if (G.coyoteT > 0) G.coyoteT = Math.max(0, G.coyoteT - dt);
  if (G.jumpBufT > 0) G.jumpBufT = Math.max(0, G.jumpBufT - dt);
  if (G.comboT > 0) { G.comboT -= dt; if (G.comboT <= 0) G.combo = 0; }

  if (G.ayran < G.maxAyran) {
    const regen = Math.max(0.55, 1.12 - (G.upLevels.belt_cap || 0) * 0.12);
    G.ayranRegenT += dt;
    if (G.ayranRegenT >= regen * 2.0) { G.ayranRegenT = 0; G.ayran++; }
  }

  if (G.bossDefeated) {
    G.levelClearT -= dt;
    if (G.levelClearT <= 0) {
      if (G.levelIdx < LEVELS.length - 1) G.screen = 'shop';
      else { G.screen = 'victory'; playSfx('sfx_win'); }
      return;
    }
  }

  let moveDir = 0;
  if (G.knockTimer > 0) {
    G.knockTimer -= dt;
    G.pvx *= Math.max(0, 1 - dt * 5.5);
  } else {
    if (G.keys['KeyA'] || G.keys['ArrowLeft'] || G.holdLeft) moveDir -= 1;
    if (G.keys['KeyD'] || G.keys['ArrowRight'] || G.holdRight) moveDir += 1;
    const sprint = !!(G.keys['ShiftLeft'] || G.keys['ShiftRight']);
    const maxSpd = sprint ? 420 : 295;
    if (moveDir !== 0) {
      G.facing = moveDir; G.pvx = moveDir * maxSpd;
      G.walkT += dt * (sprint ? 1.45 : 1.0);
      if (G.onGround && Math.random() < (sprint ? 0.35 : 0.14)) spawnParticles(G.px - moveDir * 24, G.py - 5, 1, 210, 195, 165, 55, 60, 4, 8);
    } else {
      G.pvx *= Math.max(0, 1 - dt * 14);
    }
  }
  G.px = Math.max(70, Math.min(WORLD_W - 70, G.px + G.pvx * dt));

  const wasGrounded = G.onGround;
  const prevPy = G.py;
  G.pvy += 1720 * dt; G.py += G.pvy * dt;
  G.onGround = false; G.onPlatform = false;

  if (G.pvy >= 0 && G.dropThroughT <= 0) {
    const propTopY = GROUND_Y - PROP_TOP_H;
    for (const p of G.props) {
      if (p.state < 2 && Math.abs(G.px - p.x) < 62 && prevPy <= propTopY + 18 && G.py >= propTopY) {
        G.py = propTopY; G.pvy = 0; G.onGround = true; G.onPlatform = true;
        G.jumpsLeft = 1 + ((G.upLevels.belt_cap || 0) >= 1 ? 1 : 0);
        if (!wasGrounded) { G.heroSX = 1.20; G.heroSY = 0.82; p.shake = 0.14; spawnParticles(G.px, propTopY, 5, 255, 230, 165, 90, 120, 3, 6); }
        break;
      }
    }
  }
  if (!G.onGround && G.py >= GROUND_Y) {
    G.py = GROUND_Y; G.pvy = 0; G.onGround = true;
    G.jumpsLeft = 1 + ((G.upLevels.belt_cap || 0) >= 1 ? 1 : 0);
    if (!wasGrounded) { G.heroSX = 1.22; G.heroSY = 0.80; spawnParticles(G.px, GROUND_Y - 4, 6, 220, 205, 180, 95, 120, 4, 7); }
  }
  if (wasGrounded && !G.onGround && G.pvy >= 0) G.coyoteT = 0.11;
  if (G.jumpBufT > 0 && (G.onGround || G.coyoteT > 0)) executeJump();

  const targetCam = Math.max(0, Math.min(WORLD_W - VW, G.px - VW * 0.42 + G.facing * 55));
  G.camX += (targetCam - G.camX) * Math.min(1, dt * 6.5);

  if (!G.bossDefeated) {
    if (G.calmedInLevel >= lvl.goal && !G.bossSpawned) spawnZombie(true);
    else if (!G.bossSpawned) {
      G.spawnT -= dt;
      const active = G.zombies.filter(z => !z.calmed).length;
      const maxActive = G.levelIdx === 0 ? 4 : (G.levelIdx === 1 ? 5 : 6);
      if (G.spawnT <= 0 && active < maxActive) {
        spawnZombie(false); G.spawnT = lvl.spawnRate * (0.92 + Math.random() * 0.42);
      }
    }
  }

  // Player projectiles
  G.projectiles = G.projectiles.filter(pr => {
    pr.life -= dt; pr.vy += 430 * dt; pr.x += pr.vx * dt; pr.y += pr.vy * dt; pr.rot += pr.facing * 14 * dt;
    for (const z of G.zombies) {
      if (z.calmed) continue;
      const hitW = z.isBoss ? 76 : 50, hitH = z.isBoss ? 190 : 150;
      if (Math.abs(pr.x - z.x) < hitW && pr.y > z.y - hitH && pr.y < z.y + 18) {
        z.hp -= pr.dmg; z.wetT = 3.5; z.hitFlash = 0.16; z.squashX = 1.18; z.squashY = 0.85;
        spawnVfxSprite('vfx_splash_ayran', pr.x, pr.y - 10, 78, 68, 0.40);
        z.vx = pr.facing * (z.isBoss ? 95 : 190);
        if (z.isBoss && z.aiState === 'channel') {
          z.channelHits++;
          if (z.channelHits >= 2) { z.aiState = 'chase'; z.aiCd = 5.5; z.stunT = 2.0; spawnFloat(z.x, z.y - 220, 'AYRANLA BÜFE İPTAL!', 110, 238, 255, 22, 1.3); }
        }
        playSfx('sfx_splash'); addTrauma(0.12);
        spawnParticles(pr.x, pr.y, 15, 242, 252, 255, 220, 320, 4, 9);
        if (pr.splashRad > 0) {
          spawnShockwave(pr.x, pr.y, pr.splashRad, 220, 248, 255, 0.28);
          for (const oz of G.zombies) {
            if (oz !== z && !oz.calmed && Math.abs(oz.x - pr.x) < pr.splashRad) {
              oz.hp -= Math.floor(pr.dmg * 0.5); oz.wetT = 4.5; oz.hitFlash = 0.12;
              if (oz.hp <= 0) calmZombie(oz);
            }
          }
        }
        if (z.hp <= 0) calmZombie(z);
        else spawnFloat(z.x, z.y - 135, `-${pr.dmg} ISLAK!`, 145, 238, 255, 18, 0.72);
        return false;
      }
    }
    // Ayran flies past street props to hit enemies behind cover
    if (pr.y >= GROUND_Y - 10) { playSfx('sfx_splash'); spawnParticles(pr.x, GROUND_Y - 10, 9, 240, 252, 255, 160, 260, 3, 7); return false; }
    return pr.life > 0;
  });

  // Enemy projectiles
  G.enemyProjs = G.enemyProjs.filter(ep => {
    ep.life -= dt; ep.vy += 310 * dt; ep.x += ep.vx * dt; ep.y += ep.vy * dt; ep.rot += 9 * dt;
    // TACTICAL COVER: Prop blocks enemy projectiles!
    for (const p of G.props) {
      if (p.state < 2 && Math.abs(ep.x - p.x) < 44 && ep.y > GROUND_Y - 110 && ep.y < GROUND_Y) {
        damageProp(p);
        spawnParticles(ep.x, ep.y, 8, 240, 195, 120, 160, 200, 3, 6);
        spawnFloat(p.x, GROUND_Y - 130, 'SİPER! BLOKLANDI!', 120, 245, 255, 16, 0.75);
        if (ep.img === 'proj_sicak_cay') spawnVfxSprite('vfx_puddle_tea', ep.x, GROUND_Y - 8, 64, 28, 2.2);
        else if (ep.img === 'proj_curuk_domates') spawnVfxSprite('vfx_splat_tomato', ep.x, GROUND_Y - 8, 60, 26, 2.0);
        return false;
      }
    }
    if (Math.abs(ep.x - G.px) < 38 && ep.y > G.py - 145 && ep.y < G.py - 10) {
      hurtPlayer(ep.dmg, ep.vx >= 0 ? 1 : -1); return false;
    }
    if (ep.y >= GROUND_Y - 6) { spawnParticles(ep.x, GROUND_Y - 8, 6, ep.r, ep.g, ep.b, 120, 220, 3, 6); return false; }
    return ep.life > 0;
  });

  // Zombies
  G.zombies = G.zombies.filter(z => {
    z.animT += dt;
    z.squashX += (1 - z.squashX) * Math.min(1, dt * 12);
    z.squashY += (1 - z.squashY) * Math.min(1, dt * 12);
    if (z.hitFlash > 0) z.hitFlash = Math.max(0, z.hitFlash - dt);
    if (z.wetT > 0) {
      z.wetT = Math.max(0, z.wetT - dt);
      if (Math.random() < 0.16) spawnParticles(z.x, z.y - 95, 1, 220, 248, 255, 45, 260, 3, 5);
    }
    if (z.stunT > 0) z.stunT = Math.max(0, z.stunT - dt);
    z.vx *= Math.max(0, 1 - dt * 8);
    if (z.calmed) {
      z.cureT = (z.cureT || 0) + dt;
      z.calmT -= dt;
      if (z.ai === 'flyer') z.y += (GROUND_Y - z.y) * Math.min(1, dt * 5.5);
      // Peak reveal at 0.43s (slot 6 — ayran-mustache smiling human emerges from foam!)
      if (!z.curePopDone && z.cureT >= 0.43) {
        z.curePopDone = true;
        z.squashX = 1.20; z.squashY = 0.84;
        spawnParticles(z.x, z.y - 105, z.isBoss ? 34 : 16, 255, 240, 120, 250, 240, 4, 8);
        spawnFloat(z.x, z.y - (z.isBoss ? 245 : 190), z.quote, 24, 22, 34, z.isBoss ? 18 : 14.5, 1.85, true);
      }
      // Phase 1 (0..0.86s): planted on sidewalk; Phase 2 (0.86..holdEnd): celebrate; Phase 3: skip away
      const holdEnd = z.isBoss ? 2.55 : 1.90;
      if (z.cureT > holdEnd) z.x += -z.facing * 95 * dt;
      return z.calmT > 0;
    }
    if (z.stunT > 0) z.x += z.vx * dt; else updateZombieAI(z, dt);
    z.x = Math.max(40, Math.min(WORLD_W - 40, z.x));
    return true;
  });

  for (const p of G.props) if (p.shake > 0) p.shake = Math.max(0, p.shake - dt);

  G.pickups = G.pickups.filter(pk => {
    pk.life -= dt; pk.vy += 880 * dt; pk.y += pk.vy * dt;
    if (pk.y > GROUND_Y - 22) { pk.y = GROUND_Y - 22; pk.vy = 0; }
    const dx = G.px - pk.x, dy = (G.py - 75) - pk.y;
    const d = Math.hypot(dx, dy);
    if (d < 185) { pk.x += (dx / Math.max(1, d)) * 490 * dt; pk.y += (dy / Math.max(1, d)) * 490 * dt; }
    if (d < 48) {
      playSfx('sfx_coin');
      if (pk.kind === 'coin') { G.gold += pk.val; spawnFloat(pk.x, pk.y - 30, `+${pk.val} ₺`, 255, 220, 75, 19, 0.85); }
      else if (pk.kind === 'ayran') { G.ayran = Math.min(G.maxAyran, G.ayran + pk.val); spawnFloat(pk.x, pk.y - 30, `+${pk.val} AYRAN!`, 125, 230, 255, 19, 0.85); }
      else { G.hp = Math.min(G.maxHp, G.hp + pk.val); spawnFloat(pk.x, pk.y - 30, `+${pk.val} ÇAY CANI!`, 120, 255, 155, 19, 0.85); }
      return false;
    }
    return pk.life > 0;
  });

  G.particles = G.particles.filter(pt => { pt.life -= dt; pt.vy += pt.grav * dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt; return pt.life > 0; });
  G.floats = G.floats.filter(fl => { fl.life -= dt; fl.y += fl.vy * dt; return fl.life > 0; });
  G.waves = G.waves.filter(sw => { sw.life -= dt; sw.rad = 24 + (sw.maxRad - 24) * (1 - sw.life / sw.maxLife); return sw.life > 0; });
}

// ============================================================================
// DRAWING PRIMITIVES
// ============================================================================
function addZone(id, x, y, w, h) { G.zones.push({ id, x, y, w, h }); }

function roundRect(x, y, w, h, r) {
  const cr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + cr, y);
  ctx.arcTo(x + w, y, x + w, y + h, cr);
  ctx.arcTo(x + w, y + h, x, y + h, cr);
  ctx.arcTo(x, y + h, x, y, cr);
  ctx.arcTo(x, y, x + w, y, cr);
  ctx.closePath();
}
function fillRectR(x, y, w, h, r, col) { roundRect(x, y, w, h, r); ctx.fillStyle = col; ctx.fill(); }
function strokeRectR(x, y, w, h, r, col, lw) { roundRect(x, y, w, h, r); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.stroke(); }

function drawLabel(str, x, y, size, col, align = 'center', bold = true) {
  ctx.font = `${bold ? '800' : '700'} ${size}px ${bold ? 'BalooBold' : 'BalooMed'}, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = col; ctx.fillText(str, x, y);
}
function drawOutlined(str, x, y, size, col, align = 'center', bold = true) {
  ctx.font = `${bold ? '800' : '700'} ${size}px ${bold ? 'BalooBold' : 'BalooMed'}, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#16121e'; ctx.lineWidth = Math.max(3, size * 0.19);
  ctx.strokeText(str, x, y + 1.5);
  ctx.fillStyle = col; ctx.fillText(str, x, y);
}

function drawImgBox(id, x, y, w, h, alpha = 1) {
  const im = images[id];
  if (!im || !im.complete || im.naturalWidth === 0) return;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.drawImage(im, x, y, w, h);
  ctx.restore();
}
function drawImgCenter(id, cx, cy, targetH, rot = 0, alpha = 1) {
  const im = images[id];
  if (!im || !im.complete || im.naturalWidth === 0) return;
  const k = targetH / im.naturalHeight;
  const w = im.naturalWidth * k, h = targetH;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(cx, cy); if (rot) ctx.rotate(rot);
  ctx.drawImage(im, -w / 2, -h / 2, w, h);
  ctx.restore();
}
function drawImgFoot(id, fx, fy, targetH, flip = 1, sx = 1, sy = 1, rot = 0, alpha = 1) {
  const im = images[id];
  if (!im || !im.complete || im.naturalWidth === 0) return;
  const k = targetH / im.naturalHeight;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(fx, fy); if (rot) ctx.rotate(rot);
  ctx.scale(k * flip * sx, k * sy);
  ctx.drawImage(im, -im.naturalWidth / 2, -im.naturalHeight);
  ctx.restore();
}
const SHEET_META = {
  hero_nazar:   { cols: 4, rows: 3, anchorX: 0.30, anchorY: 0.92 },
  hero_cologne: { cols: 4, rows: 3, anchorX: 0.30, anchorY: 0.92 },
};
function drawSheetFrame(id, cols, slot, fx, fy, targetH, flip = 1, sx = 1, sy = 1, rot = 0, alpha = 1) {
  const im = images[id];
  if (!im || !im.complete || im.naturalWidth === 0) return;
  const meta = SHEET_META[id];
  const cCount = meta ? meta.cols : cols;
  const cellW = im.naturalWidth / cCount;
  const cellH = meta ? (im.naturalHeight / meta.rows) : cellW;
  const ax = meta ? meta.anchorX : 0.5;
  const ay = meta ? meta.anchorY : 0.92;
  const s = Math.max(0, Math.floor(slot));
  const col = s % cCount, row = Math.floor(s / cCount);
  const k = targetH / cellH;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(fx, fy); if (rot) ctx.rotate(rot);
  ctx.scale(k * flip * sx, k * sy);
  ctx.drawImage(im, col * cellW + 1, row * cellH + 1, cellW - 2, cellH - 2, -cellW * ax, -cellH * ay, cellW, cellH);
  ctx.restore();
}

function drawWoodenModal(x, y, w, h) {
  const headH = Math.max(82, Math.min(126, w * 0.118));
  drawImgBox('ui_board_wood', x + w * 0.015, y + headH * 0.56, w * 0.97, h - headH * 0.56);
  drawImgBox('ui_header_plank', x, y, w, headH);
}
function drawGoldBtn(zoneId, cx, cy, w, h, text, fontSize, showPlay = true) {
  const hov = G.hover === zoneId;
  const sc = hov ? 1.045 : 1.0;
  const bw = w * sc, bh = h * sc;
  const bx = cx - bw / 2, by = cy - bh / 2 + (hov ? -2 : 0);
  if (showPlay) {
    const col = hov ? '#ffe05c' : 'rgba(255,224,92,0.82)';
    fillRectR(bx - 22, cy - 10, 14, 5, 3, col);
    fillRectR(bx - 26, cy + 7, 16, 5, 3, col);
    fillRectR(bx + bw + 8, cy - 10, 14, 5, 3, col);
    fillRectR(bx + bw + 10, cy + 7, 16, 5, 3, col);
  }
  drawImgBox('ui_btn_gold', bx, by, bw, bh);
  const ty = by + bh * 0.56;
  if (showPlay) {
    const ih = fontSize * 0.96, iw = ih * 0.75;
    const tx = cx - (text.length * fontSize * 0.25) - 18;
    drawImgBox('ui_play_icon', tx - iw / 2, ty - ih / 2, iw, ih);
    drawLabel(text, cx + 14, ty + 2, fontSize, 'rgba(255,232,140,0.55)', 'center', true);
    drawLabel(text, cx + 14, ty, fontSize, '#3e1806', 'center', true);
  } else {
    drawLabel(text, cx, ty, fontSize, '#3e1806', 'center', true);
  }
  addZone(zoneId, cx - w / 2, cy - h / 2, w, h);
}
function drawWoodPad(x, y, w, h) {
  fillRectR(x, y + 4, w, h, 12, 'rgba(16,12,24,0.82)');
  fillRectR(x, y, w, h, 12, '#7c4826');
  fillRectR(x + 4, y + 3, w - 8, h * 0.36, 8, 'rgba(156,96,52,0.65)');
  strokeRectR(x, y, w, h, 12, '#18121e', 3.2);
}
function drawSpeechBubble(str, cx, cy, size, alpha) {
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.font = `800 ${size}px BalooBold, "Arial Black", sans-serif`;
  const maxLineW = 360;
  let lines = [str];
  if (ctx.measureText(str).width > maxLineW) {
    const words = str.split(' ');
    lines = [''];
    for (const w of words) {
      const cand = lines[lines.length - 1] ? lines[lines.length - 1] + ' ' + w : w;
      if (lines[lines.length - 1] && ctx.measureText(cand).width > maxLineW) lines.push(w);
      else lines[lines.length - 1] = cand;
    }
  }
  const textW = Math.max(...lines.map(l => ctx.measureText(l).width));
  const bw = Math.max(124, Math.ceil(textW) + 30);
  const lineH = size + 5;
  const bh = lines.length * lineH + 16;
  const bx = Math.max(14, Math.min(VW - bw - 14, cx - bw / 2));
  const by = cy - bh / 2;
  const tx = Math.max(bx + 18, Math.min(bx + bw - 18, cx));
  fillRectR(bx + 2, by + 3, bw, bh, 12, 'rgba(18,14,28,0.75)');
  fillRectR(bx, by, bw, bh, 12, '#fffdf4');
  strokeRectR(bx, by, bw, bh, 12, '#161420', 2.5);
  ctx.beginPath(); ctx.moveTo(tx - 8, by + bh - 1); ctx.lineTo(tx + 8, by + bh - 1); ctx.lineTo(tx, by + bh + 9); ctx.closePath();
  ctx.fillStyle = '#fffdf4'; ctx.fill();
  lines.forEach((l, li) => {
    const ly = by + 8 + lineH * (li + 0.5);
    drawLabel(l, bx + bw / 2, ly, size, '#181622', 'center', true);
  });
  ctx.restore();
}

// SCREENS
// ============================================================================
function drawWorld() {
  const lvl = LEVELS[G.levelIdx];
  const sh = G.trauma * G.trauma;
  const sx = 18 * sh * Math.sin(G.shakeClock * 1.7);
  const sy = 12 * sh * Math.sin(G.shakeClock * 2.3);

  ctx.save();
  ctx.translate(-G.camX + sx, sy);

  // Extended 3840x720 Classic Dark-Apocalypse Street
  drawImgBox(lvl.bg, 0, 0, WORLD_W, VH);

  // Ground VFX Splats
  if (G.vfxSprites && G.vfxSprites.length > 0) {
    G.vfxSprites = G.vfxSprites.filter(v => {
      if (G.screen === 'play') v.life -= (G.dt || 0.016);
      if (v.life <= 0) return false;
      const alpha = Math.min(1.0, v.life / (v.maxLife * 0.35));
      drawImgBox(v.img, v.x - v.w / 2, v.y - v.h / 2, v.w, v.h, alpha);
      return true;
    });
  }

  // Street props
  const propTopY = GROUND_Y - PROP_TOP_H;
  for (const p of G.props) {
    const pid = `p_${p.kind}_${p.state}`;
    const pH = p.state === 2 ? 82 : 138;
    const psh = p.shake > 0 ? Math.sin(G.time * 55) * 6 : 0;
    ctx.fillStyle = 'rgba(12,10,22,0.45)';
    ctx.beginPath(); ctx.ellipse(p.x, GROUND_Y + 4, 54, 13, 0, 0, Math.PI * 2); ctx.fill();
    drawImgFoot(pid, p.x + psh, GROUND_Y + 6, pH);
    if (p.state < 2 && Math.abs(G.px - p.x) < 260) {
      fillRectR(p.x - 42, propTopY - 2, 84, 5, 3, 'rgba(120,240,255,0.52)');
    }
  }

  // Pickups
  for (const pk of G.pickups) {
    const blink = (pk.life < 2.0 && Math.floor(G.time * 16) % 2 === 0) ? 0.35 : 1.0;
    const bob = Math.sin(G.time * 6.5 + pk.x) * 6;
    const ic = pk.kind === 'coin' ? 'ui_coin' : (pk.kind === 'ayran' ? 'ui_ayran_icon' : 'ui_heart');
    drawImgCenter(ic, pk.x, pk.y + bob, pk.kind === 'ayran' ? 42 : 38, 0, blink);
  }

  // Zombies
  for (const z of G.zombies) {
    const targetH = 166 * z.scale;
    const t = z.cureT || 0;
    const holdEnd = z.isBoss ? 2.55 : 1.90;
    const op = z.calmed ? Math.min(1, z.calmT / 0.65) : 1;

    ctx.fillStyle = `rgba(12,10,22,${0.52 * op})`;
    const shS = z.ai === 'flyer' ? 0.65 : 1;
    ctx.beginPath(); ctx.ellipse(z.x, GROUND_Y + 4, 42 * z.scale * shS, 12 * z.scale * shS, 0, 0, Math.PI * 2); ctx.fill();

    if (!z.calmed) {
      const bob = z.ai === 'flyer' ? 0 : Math.abs(Math.sin(z.animT * 6.8)) * 7;
      let tilt = Math.sin(z.animT * 6.8) * 0.06 * z.facing;
      if (z.aiState === 'telegraph') tilt = -0.18 * z.facing;
      else if (z.aiState === 'action') tilt = 0.22 * z.facing;

      if (z.aiState === 'telegraph') {
        ctx.fillStyle = 'rgba(255,65,55,0.34)';
        ctx.beginPath(); ctx.ellipse(z.x, z.y - targetH * 0.45, 68 * z.scale, 84 * z.scale, 0, 0, Math.PI * 2); ctx.fill();
        if (z.isBoss && z.bossSpecial === 'quake') fillRectR(z.x - 420, GROUND_Y - 12, 840, 18, 6, 'rgba(255,65,55,0.44)');
      } else if (z.aiState === 'channel') {
        ctx.fillStyle = 'rgba(90,255,130,0.32)';
        ctx.beginPath(); ctx.arc(z.x, z.y - targetH * 0.5, 95 + Math.sin(G.time * 12) * 12, 0, Math.PI * 2); ctx.fill();
      } else if (z.wetT > 0) {
        ctx.fillStyle = 'rgba(125,235,255,0.36)';
        ctx.beginPath(); ctx.ellipse(z.x, z.y - targetH * 0.45, 52 * z.scale, 72 * z.scale, 0, 0, Math.PI * 2); ctx.fill();
      }

      const slot = z.hitFlash > 0 ? (12 + (Math.floor((0.24 - z.hitFlash) * 20) % 4)) : (Math.floor(z.animT * 10) % 12);
      drawSheetFrame(z.img, 4, slot, z.x, z.y - bob * 0.25, 216 * z.scale, z.facing, z.squashX, z.squashY, tilt * 0.45, 1);

      const topY = z.y - targetH - 18;
      if (!z.isBoss && z.hp < z.maxHp) {
        fillRectR(z.x - 33, topY, 66, 9, 4, 'rgba(22,18,34,0.88)');
        fillRectR(z.x - 31, topY + 2, Math.max(0, 62 * (z.hp / z.maxHp)), 5, 2, z.wetT > 0 ? '#5fe4ff' : '#78f569');
      }
      if (z.wetT > 0) drawOutlined('ISLAK! [K]', z.x, topY - 14, 13, '#7df0ff');
      if (z.stunT > 0) {
        for (let si = 0; si < 3; si++) {
          const a = G.time * 7 + si * 2.094;
          ctx.fillStyle = '#ffe650'; ctx.beginPath(); ctx.arc(z.x + Math.cos(a) * 28, topY - 4 + Math.sin(a) * 7, 5, 0, Math.PI * 2); ctx.fill();
        }
      }
    } else {
      const curedId = 'c_' + z.img.slice(2);
      const hasCured = images[curedId] && images[curedId].complete && images[curedId].naturalWidth > 0;
      const cSlot = Math.min(11, Math.floor(t * 14));
      let cBob = 0, cTilt = 0;
      if (t >= 0.86 && t <= holdEnd) {
        cBob = Math.abs(Math.sin((t - 0.86) * 7.5)) * 5;
        cTilt = Math.sin((t - 0.86) * 7.5) * 0.04;
      } else if (t > holdEnd) {
        cBob = Math.abs(Math.sin((t - holdEnd) * 11)) * 10;
        cTilt = 0.05 * (-z.facing);
      }
      const flip = (t <= holdEnd) ? z.facing : -z.facing;
      const auraA = Math.min(1, Math.max(0, (t - 0.32) / 0.35)) * 0.34 * op;
      if (auraA > 0.01) {
        ctx.fillStyle = `rgba(255,235,110,${auraA})`;
        ctx.beginPath(); ctx.ellipse(z.x, z.y - targetH * 0.45, 58 * z.scale, 72 * z.scale, 0, 0, Math.PI * 2); ctx.fill();
      }
      drawSheetFrame(hasCured ? curedId : z.img, 4, hasCured ? cSlot : (Math.floor(z.animT * 14) % 12), z.x, z.y - cBob, 216 * z.scale, flip, z.squashX, z.squashY, cTilt, op);
    }
  }

  // Hero (7 animated sheets)
  let hSheet = 'hero_idle', hSlot = Math.floor(G.time * 8) % 12;
  if (G.nazarAnimT > 0) { hSheet = 'hero_nazar'; hSlot = Math.min(11, Math.floor((0.58 - G.nazarAnimT) / 0.58 * 12)); }
  else if (G.kolonyaVfxT > 0) { hSheet = 'hero_cologne'; hSlot = Math.min(11, Math.floor((0.36 - G.kolonyaVfxT) / 0.36 * 12)); }
  else if (G.hitAnimT > 0) { hSheet = 'hero_hit'; hSlot = Math.min(3, Math.floor((0.32 - G.hitAnimT) / 0.32 * 4)); }
  else if (G.throwAnimT > 0) { hSheet = 'hero_throw'; hSlot = Math.min(11, Math.floor((0.26 - G.throwAnimT) / 0.26 * 12)); }
  else if (!G.onGround) { hSheet = 'hero_jump'; hSlot = Math.min(11, Math.floor(Math.max(0, Math.min(1, (G.pvy + 690) / 1380)) * 11)); }
  else if (Math.abs(G.pvx) > 25) { hSheet = 'hero_run'; hSlot = Math.floor(G.walkT * (Math.abs(G.pvx) > 320 ? 16 : 12)) % 12; }

  const hOp = (G.invulnT > 0 && Math.floor(G.time * 22) % 2 === 0) ? 0.55 : 1;
  const shadowY = G.onPlatform ? (GROUND_Y - PROP_TOP_H + 3) : (GROUND_Y + 4);
  const shSc = Math.max(0.45, 1 - Math.max(0, shadowY - G.py) / 360);
  ctx.fillStyle = 'rgba(12,10,22,0.55)';
  ctx.beginPath(); ctx.ellipse(G.px, shadowY, 44 * shSc, 12 * shSc, 0, 0, Math.PI * 2); ctx.fill();
  drawSheetFrame(hSheet, 4, hSlot, G.px, G.py, 222, G.facing, G.heroSX, G.heroSY, 0, hOp);

  if (G.kolonyaVfxT > 0) drawImgCenter('proj_kolonya_bulutu', G.px + G.facing * G.kolonyaRange * 0.52, G.py - 92, 138, G.facing < 0 ? Math.PI : 0, Math.min(1, G.kolonyaVfxT / 0.36 * 1.25));
  if (G.nazarAnimT > 0) drawImgCenter('proj_nazar_halka', G.px + G.facing * 95, G.py - 96, 165, G.time * 8, Math.min(1, G.nazarAnimT / 0.58 * 1.3));

  for (const pr of G.projectiles) drawImgCenter('proj_ayran_sise', pr.x, pr.y, 46, pr.rot, 1);
  for (const ep of G.enemyProjs) {
    if (ep.img && images[ep.img]) drawImgCenter(ep.img, ep.x, ep.y, 54, ep.rot, 1);
    drawOutlined(ep.label, ep.x, ep.y - 34, 12, '#fff08c');
  }

  for (const sw of G.waves) {
    ctx.strokeStyle = `rgba(${sw.r},${sw.g},${sw.b},${(sw.life / sw.maxLife) * 0.9})`;
    ctx.lineWidth = 9; ctx.beginPath();
    if (sw.groundOnly) ctx.ellipse(sw.x, sw.y, sw.rad, 22, 0, 0, Math.PI * 2);
    else ctx.arc(sw.x, sw.y, sw.rad, 0, Math.PI * 2);
    ctx.stroke();
  }
  for (const pt of G.particles) {
    ctx.fillStyle = `rgba(${pt.r},${pt.g},${pt.b},${pt.life / pt.maxLife})`;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.rad, 0, Math.PI * 2); ctx.fill();
  }
  for (const fl of G.floats) {
    const a = Math.min(1, (fl.life / fl.maxLife) * 1.6);
    if (fl.isBubble) drawSpeechBubble(fl.text, fl.x, fl.y, fl.size, a);
    else { ctx.save(); ctx.globalAlpha = a; drawOutlined(fl.text, fl.x, fl.y, fl.size, `rgb(${fl.r},${fl.g},${fl.b})`); ctx.restore(); }
  }

  // Atmospheric drifting cold snow flakes with parallax depth
  if (G.snowFlakes) {
    ctx.fillStyle = '#ffffff';
    for (const f of G.snowFlakes) {
      const fdt = (G.screen === 'play') ? (G.dt || 0.016) : 0;
      f.x += f.vx * fdt;
      f.y += f.vy * fdt;
      if (f.y > VH) { f.y = -10; f.x = Math.random() * (WORLD_W + 400) - 200; }
      if (f.x < -200) { f.x = WORLD_W + 100; }
      const sx = f.x - G.camX * f.depth;
      if (sx >= -20 && sx <= VW + 20) {
        ctx.save();
        ctx.globalAlpha = f.alpha;
        ctx.beginPath();
        ctx.arc(sx, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
  }

  ctx.restore();
}

    drawLabel(l, sx + 112, 410, 14, '#ebe1cd', 'center', false);
    drawOutlined(String(v), sx + 112, 444, 28, c);
  });
  drawOutlined(`En Yüksek Skor: ${G.bestScore}   •   Maks. Kombo: ${G.maxCombo}x`, 640, 500, 15, '#fff4d7', 'center', false);
  const hov = G.hover === 'btn_restart';
  const bw = hov ? 320 : 306, bh = hov ? 142 : 136;
  drawImgBox(isWin ? 'hud_cta_gold' : 'hud_cta_red', 640 - bw / 2, 578 - bh / 2, bw, bh);
  drawOutlined(isWin ? 'TEKRAR OYNA!' : 'TEKRAR DENE!', 640, 594, 26, '#ffffff');
  addZone('btn_restart', 480, 520, 320, 118);
}

function drawPauseModal() {
  drawWorld(); drawHUD();
  fillRectR(0, 0, VW, VH, 0, 'rgba(12,10,26,0.65)');
  drawWoodenModal(324, 126, 632, 456);
  drawImgBox('ui_badge_red', 448, 114, 384, 96);
  drawOutlined('ÇAY MOLASI', 640, 160, 28, '#ffec6e');
  const h1 = G.hover === 'btn_resume', w1 = h1 ? 292 : 278, hh1 = h1 ? 134 : 128;
  drawImgBox('hud_cta_gold', 640 - w1 / 2, 304 - hh1 / 2, w1, hh1);
  drawOutlined('DEVAM ET', 640, 320, 25, '#ffffff');
  addZone('btn_resume', 494, 248, 292, 116);
  const h2 = G.hover === 'btn_restart', w2 = h2 ? 278 : 264, hh2 = h2 ? 126 : 120;
  drawImgBox('hud_cta_red', 640 - w2 / 2, 442 - hh2 / 2, w2, hh2);
  drawOutlined('BAŞTAN BAŞLA', 640, 456, 22, '#ffffff');
  addZone('btn_restart', 500, 388, 280, 112);
}

// ============================================================================
// INPUT & MAIN LOOP
// ============================================================================
function getVirtualPos(ev) {
  const rect = canvas.getBoundingClientRect();
  return { x: (ev.clientX - rect.left) / rect.width * VW, y: (ev.clientY - rect.top) / rect.height * VH };
}
function hitTest(vx, vy) {
  for (let i = G.zones.length - 1; i >= 0; i--) {
    const z = G.zones[i];
    if (vx >= z.x && vx <= z.x + z.w && vy >= z.y && vy <= z.y + z.h) return z.id;
  }
  return '';
}

canvas.addEventListener('pointermove', ev => {
  const p = getVirtualPos(ev);
  G.hover = hitTest(p.x, p.y);
});
canvas.addEventListener('pointerup', () => { G.holdLeft = false; G.holdRight = false; });
canvas.addEventListener('contextmenu', ev => { ev.preventDefault(); if (G.screen === 'play') useKolonya(); });
canvas.addEventListener('pointerdown', ev => {
  if (ev.button === 2) { if (G.screen === 'play') useKolonya(); return; }
  const p = getVirtualPos(ev);
  const id = hitTest(p.x, p.y);
  if (id === 'btn_start') { resetFullGame(); G.screen = 'intro'; playSfx('sfx_coin'); return; }
  if (id === 'btn_go_play') { G.screen = 'play'; playSfx('sfx_win'); return; }
  if (id === 'btn_shop') { if (G.screen === 'shop') G.screen = 'play'; else tryOpenShop(); return; }
  if (id === 'btn_shop_next') { if (G.bossDefeated) { setupLevel(G.levelIdx + 1); G.screen = 'intro'; } else G.screen = 'play'; return; }
  if (id === 'btn_pause') { G.screen = 'pause'; return; }
  if (id === 'btn_resume') { G.screen = 'play'; return; }
  if (id === 'btn_restart') {
    if (G.screen === 'gameover') {
      G.hp = G.maxHp; G.ayran = G.maxAyran;
      setupLevel(G.levelIdx); G.screen = 'play'; return;
    }
    resetFullGame(); G.screen = 'title'; return;
  }
  if (id.startsWith('buy_')) { buyUpgrade(id.slice(4)); return; }
  if (id === 'pad_left') { G.holdLeft = true; return; }
  if (id === 'pad_right') { G.holdRight = true; return; }
  if (id === 'pad_jump') { G.jumpBufT = 0.12; executeJump(); return; }
  if (id === 'btn_ayran') { fireAyran(null); return; }
  if (id === 'btn_kolonya') { useKolonya(); return; }
  if (id === 'btn_nazar') { useMegaNazar(); return; }
  if (G.screen === 'play') fireAyran((p.x + G.camX) >= G.px ? 1 : -1);
});

window.addEventListener('keydown', ev => {
  const first = !G.keys[ev.code];
  G.keys[ev.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(ev.code)) ev.preventDefault();
  if (!first) return;
  if (loadedCount < totalAssets && G.time <= 10) return;
  if (G.screen === 'title' && (ev.code === 'Space' || ev.code === 'Enter')) { resetFullGame(); G.screen = 'intro'; playSfx('sfx_coin'); return; }
  if (G.screen === 'intro' && (ev.code === 'Space' || ev.code === 'Enter')) { G.screen = 'play'; playSfx('sfx_win'); return; }
  if (G.screen === 'gameover') {
    if (ev.code === 'Space' || ev.code === 'Enter' || ev.code === 'KeyR') {
      // Retry level keeps upgrades & coins!
      G.hp = G.maxHp; G.ayran = G.maxAyran;
      setupLevel(G.levelIdx); G.screen = 'play'; return;
    } else if (ev.code === 'Escape') {
      resetFullGame(); G.screen = 'title'; return;
    }
  }
  if (G.screen === 'victory' && (ev.code === 'Space' || ev.code === 'Enter')) {
    resetFullGame(); G.screen = 'title'; return;
  }
  if (G.screen === 'pause' && (ev.code === 'Escape' || ev.code === 'KeyP')) { G.screen = 'play'; return; }
  if (G.screen === 'shop' && (ev.code === 'Escape' || ev.code === 'KeyM')) { if (G.bossDefeated) { setupLevel(G.levelIdx + 1); G.screen = 'intro'; } else G.screen = 'play'; return; }
  if (G.screen === 'play') {
    if (ev.code === 'Space' || ev.code === 'KeyW' || ev.code === 'ArrowUp') { G.jumpBufT = 0.12; executeJump(); }
    else if (ev.code === 'KeyS' || ev.code === 'ArrowDown') { if (G.onPlatform) { G.dropThroughT = 0.24; G.onGround = false; G.onPlatform = false; G.pvy = 120; } }
    else if (ev.code === 'KeyJ') fireAyran(null);
    else if (ev.code === 'KeyK') useKolonya();
    else if (ev.code === 'KeyQ') useMegaNazar();
    else if (ev.code === 'KeyM') tryOpenShop();
    else if (ev.code === 'Escape' || ev.code === 'KeyP') G.screen = 'pause';
  }
});
window.addEventListener('keyup', ev => { G.keys[ev.code] = false; });

function drawLoadingScreen() {
  const grad = ctx.createLinearGradient(0, 0, 0, VH);
  grad.addColorStop(0, '#0e1024');
  grad.addColorStop(1, '#1b1f42');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, VW, VH);

  const pct = Math.min(1, loadedCount / Math.max(1, totalAssets));
  drawOutlined('BUZ GİBİ KIYAMET: SON AYRANCI', 640, 290, 38, '#ffec6e');
  drawLabel('Mahalle hazırlanıyor...', 640, 342, 20, '#bfefff', 'center', true);
  fillRectR(340, 380, 600, 30, 15, 'rgba(10, 14, 30, 0.85)');
  strokeRectR(340, 380, 600, 30, 15, '#4ee6ff', 3);
  if (pct > 0.02) {
    fillRectR(344, 384, Math.max(18, (600 - 8) * pct), 22, 11, '#4ee6ff');
  }
  drawOutlined(`${Math.round(pct * 100)}%`, 640, 440, 22, '#ffffff');
}

let lastTs = performance.now();
function loop(ts) {
  const dt = Math.min(0.05, Math.max(0.001, (ts - lastTs) / 1000));
  G.dt = dt;
  lastTs = ts;
  G.time += dt;
  const assetsReady = (loadedCount >= totalAssets && fontsReady) || G.time > 10;
  if (!assetsReady) {
    G.zones = [];
    ctx.clearRect(0, 0, VW, VH);
    drawLoadingScreen();
    requestAnimationFrame(loop);
    return;
  }
  if (G.screen === 'play') updatePlay(dt);

  G.zones = [];
  ctx.clearRect(0, 0, VW, VH);
  if (G.screen === 'title') drawTitleScreen();
  else if (G.screen === 'intro') drawComicIntro();
  else if (G.screen === 'play') { drawWorld(); drawHUD(); }
  else if (G.screen === 'shop') drawShopModal();
  else if (G.screen === 'pause') drawPauseModal();
  else if (G.screen === 'gameover') drawEndModal(false);
  else if (G.screen === 'victory') drawEndModal(true);

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
