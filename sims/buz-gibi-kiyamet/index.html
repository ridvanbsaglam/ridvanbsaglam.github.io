let isRotated = false;
let viewScale = 1;
function getFsRightOffset() {
  return (IS_TOUCH || Math.min(window.innerWidth, window.innerHeight) <= 960)
    ? Math.ceil(62 / Math.max(0.35, viewScale))
    : 0;
}

function requestMobileFullscreen() {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (req && !document.fullscreenElement && !document.webkitFullscreenElement) {
    try {
      const p = req.call(el);
      if (p && p.then) {
        p.then(() => {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(() => {});
          }
          setTimeout(resizeCanvas, 120);
        }).catch(() => {});
      }
    } catch (_) {}
  }
}

function toggleFullscreen() {
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    const ex = document.exitFullscreen || document.webkitExitFullscreen;
    if (ex) try { ex.call(document); } catch (_) {}
  } else {
    requestMobileFullscreen();
  }
}
if (fsBtn) {
  fsBtn.addEventListener('click', ev => { ev.stopPropagation(); toggleFullscreen(); });
  document.addEventListener('fullscreenchange', () => {
    const inFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
    fsBtn.textContent = inFs ? '✕' : '⛶';
    setTimeout(resizeCanvas, 80);
  });
}

// Responsive Fullscreen HiDPI sizing + Dynamic Ultrawide Viewport (Zero Black Bars!)
function resizeCanvas() {
  const dpr = Math.min(2.5, window.devicePixelRatio || 1);
  const vv = window.visualViewport;
  const availW = Math.floor(vv ? vv.width : window.innerWidth);
  const availH = Math.floor(vv ? vv.height : window.innerHeight);

  // On portrait phones/tablets, auto-rotate 90° clockwise so the game fills the full phone screen!
  isRotated = (availH > availW) && (IS_TOUCH || availW <= 768);
  const targetW = isRotated ? availH : availW;
  const targetH = isRotated ? availW : availH;

  // Dynamic Ultrawide Viewport: Calculates exact VW to match the phone's physical aspect ratio (19.5:9, 20:9, etc.)
  // Eliminates 100% of black letterbox bars on modern mobile devices!
  const aspect = targetW / Math.max(1, targetH);
  if (aspect >= 1280 / 720) {
    VW = Math.max(1280, Math.min(1760, Math.round(VH * aspect)));
    viewScale = targetH / VH;
    var cssW = targetW;
    var cssH = targetH;
  } else {
    VW = 1280;
    viewScale = Math.min(targetW / VW, targetH / VH);
    var cssW = Math.floor(VW * viewScale);
    var cssH = Math.floor(VH * viewScale);
  }

  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.style.transform = isRotated ? 'rotate(90deg)' : 'none';
  document.body.classList.toggle('rotated-mobile', isRotated);
  // Render buffer matches real physical screen pixels (zero CSS upscaling blur!)
  canvas.width = Math.floor(cssW * dpr);
  canvas.height = Math.floor(cssH * dpr);
  ctx.setTransform(viewScale * dpr, 0, 0, viewScale * dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resizeCanvas);
resizeCanvas();

const images = {};
const sfx = {};
let coreLoadedCount = 0;
const totalCoreAssets = CORE_IMAGE_IDS.length;
let bgLoadedCount = 0;
const totalBgAssets = BACKGROUND_IMAGE_IDS.length;

let fontsReady = false;
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => { fontsReady = true; }).catch(() => { fontsReady = true; });
} else fontsReady = true;
setTimeout(() => { fontsReady = true; }, 3000);

function loadSingleAsset(id, onDone) {
  if (images[id]) return images[id];
  const img = new Image();
  img.onload = () => { if (onDone) onDone(); };
  img.onerror = () => {
    // If WebP fails for any reason, fallback to original PNG/JPG
    img.onerror = () => { if (onDone) onDone(); };
    img.src = `img/${id}.png?v=13`;
  };
  img.src = `img/${id}.webp?v=13`;
  images[id] = img;
  return img;
}

// Phase 0: Priority-first hand-painted Loading UI Kit (~195 KB total WebP, non-blocking)
const LOAD_KIT_IDS = [
  'load_logo', 'load_badge_ayranci', 'load_bottle_sheet',
  'load_thermo_shell', 'load_badge_ice', 'load_bar_frame', 'load_tip_frame'
];
for (const id of LOAD_KIT_IDS) {
  loadSingleAsset(id);
}

// Phase 1: Fast-Start Critical Assets (~6 MB WebP)
for (const id of CORE_IMAGE_IDS) {
  loadSingleAsset(id, () => {
    coreLoadedCount++;
    if (coreLoadedCount >= totalCoreAssets) {
      startBackgroundPreload();
    }
  });
}

// Phase 2: Background preload for Level 2 & Level 3 assets
let bgPreloadStarted = false;
function startBackgroundPreload() {
  if (bgPreloadStarted) return;
  bgPreloadStarted = true;
  const runPreload = () => {
    for (const id of BACKGROUND_IMAGE_IDS) {
      loadSingleAsset(id, () => { bgLoadedCount++; });
    }
  };
  if (window.requestIdleCallback) {
    window.requestIdleCallback(runPreload);
  } else {

let _audioCtx = null;
function getAudioCtx() {
  if (!_audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) _audioCtx = new AC();
  }
  if (_audioCtx && _audioCtx.state === 'suspended') {
    _audioCtx.resume().catch(() => {});
  }
  return _audioCtx;
}

function playVoiceBlip(speakerId) {
  if (G.muted) return;
  const ac = getAudioCtx();
  if (!ac) return;
  const sp = (window.STORY_DATA && window.STORY_DATA.speakers[speakerId]) || { pitch: 220, wave: 'triangle' };
  try {
    const now = ac.currentTime;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = sp.wave || 'triangle';
    const jitter = 0.93 + Math.random() * 0.14;
    osc.frequency.setValueAtTime((sp.pitch || 220) * jitter, now);
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(0.055, now + 0.008);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.start(now);
    osc.stop(now + 0.05);
  } catch (_) {}
}

function playPhoneRing() {
  if (G.muted) return;
  const ac = getAudioCtx();
  if (!ac) return;
  try {
    const now = ac.currentTime;
    [0, 0.42].forEach(offset => {
      const osc1 = ac.createOscillator();
      const osc2 = ac.createOscillator();
      const gain = ac.createGain();
      osc1.type = 'sine'; osc2.type = 'sine';
      osc1.frequency.setValueAtTime(440, now + offset);
      osc2.frequency.setValueAtTime(480, now + offset);
      gain.gain.setValueAtTime(0.001, now + offset);
      gain.gain.linearRampToValueAtTime(0.08, now + offset + 0.02);
      gain.gain.setValueAtTime(0.08, now + offset + 0.24);
      gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.30);
      osc1.connect(gain); osc2.connect(gain); gain.connect(ac.destination);
      osc1.start(now + offset); osc2.start(now + offset);
      osc1.stop(now + offset + 0.31); osc2.stop(now + offset + 0.31);
    });
  } catch (_) {}
}

function playSfx(name) {
  if (G.muted) return;
  const pool = sfxPools[name];
  if (!pool) return;
  try {
    let inst = pool.list[pool.idx];
    if (!inst) {
      if (pool.list.length < 3) {
        inst = new Audio(`sfx/${name}.wav`);
        inst.volume = 0.55;
        pool.list.push(inst);
      } else {
        inst = pool.list[0];
      }
    }
    pool.idx = (pool.idx + 1) % pool.list.length;
    inst.currentTime = 0;
    inst.volume = 0.55;
    inst.play().catch(() => {});
  } catch (_) {}
}

const BgmEngine = {
  masterGain: null,

  init(ctx) {

  scheduleStep(ctx, t, track, step, dur) {

    if (track.snare[step]) this.playSnare(ctx, t);
    if (track.hihat[step]) this.playHihat(ctx, t, step % 4 === 2);
    const bn = track.bass[step];
    if (bn && bn !== '-') this.playBass(ctx, bn, t, dur);
    const ln = track.lead[step];
    if (ln && ln !== '-') this.playLead(ctx, ln, t, dur);

  update() {

    let targetTrack = '';

    } else if (G.screen === 'title' || G.screen === 'story' || G.screen === 'intro' || G.screen === 'shop' || G.screen === 'pause') {
      targetTrack = 'menu';
    } else {
      targetTrack = '';
    }

    if (targetTrack !== this.activeTrackName) {
      this.activeTrackName = targetTrack;
      this.step = 0;
      if (this.masterGain) {
        if (!targetTrack || G.muted) {
          this.masterGain.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.05);
        } else {
          this.nextStepTime = ctx.currentTime + 0.06;
          const targetVol = G.screen === 'pause' ? 0.04 : 0.16;
          this.masterGain.gain.setTargetAtTime(targetVol, ctx.currentTime, 0.08);

      const targetVol = G.muted ? 0.0001 : (G.screen === 'pause' ? 0.04 : 0.16);
      this.masterGain.gain.setTargetAtTime(targetVol, ctx.currentTime, 0.08);
    }

    if (!this.activeTrackName || G.muted) return;
    const track = BGM_TRACKS[this.activeTrackName];
    if (!track) return;
    const stepDur = 60 / (track.bpm * 4);
    if (this.nextStepTime < ctx.currentTime - 0.5) this.nextStepTime = ctx.currentTime + 0.02;

    const lookahead = 0.14;
    while (this.nextStepTime < ctx.currentTime + lookahead) {
      this.scheduleStep(ctx, this.nextStepTime, track, this.step, stepDur);
      this.step = (this.step + 1) % track.steps;
      this.nextStepTime += stepDur;
    }
  }

function resetStoryState() {
  const baseVars = (window.STORY_DATA && window.STORY_DATA.vars) ? { ...window.STORY_DATA.vars } : {};
  G.story = {
    sceneId: '', nodeId: '', vars: baseVars, seen: {}, backlog: [],
    logOpen: false, charIdx: 0, typeAcc: 0, blipAcc: 0, nodeT: 0,
    onComplete: null,
  };
}

function getStoryNode() {
  if (!window.STORY_DATA || !G.story.sceneId) return null;
  const sc = window.STORY_DATA.scenes[G.story.sceneId];
  return sc ? sc.nodes[G.story.nodeId] : null;
}

function enterStoryNode(nodeId) {
  const sc = window.STORY_DATA && window.STORY_DATA.scenes[G.story.sceneId];
  if (!sc || !sc.nodes[nodeId]) { finishStoryScene(); return; }
  G.story.nodeId = nodeId;
  G.story.charIdx = 0;
  G.story.typeAcc = 0;
  G.story.blipAcc = 0;
  G.story.nodeT = 0;
  const node = sc.nodes[nodeId];
  if (node.set) Object.assign(G.story.vars, node.set);
  if (node.phoneRing) playPhoneRing();
  if (node.sfx) playSfx('sfx_' + node.sfx);
}

function startStoryScene(sceneId, onComplete, forceReplay = false) {
  const sc = window.STORY_DATA && window.STORY_DATA.scenes[sceneId];
  if (!sc || (G.story.seen[sceneId] && !forceReplay)) {
    if (onComplete) onComplete();
    return;
  }
  G.story.sceneId = sceneId;
  G.story.onComplete = onComplete || null;
  G.story.logOpen = false;
  G.screen = 'story';
  enterStoryNode(sc.start);
}

function finishStoryScene() {
  if (G.story.sceneId) G.story.seen[G.story.sceneId] = true;
  const cb = G.story.onComplete;
  G.story.sceneId = '';
  G.story.nodeId = '';
  G.story.logOpen = false;
  G.story.onComplete = null;
  if (cb) cb();
}

function skipStoryScene() {
  playSfx('sfx_coin');
  finishStoryScene();
}

function pushBacklog(speakerId, text) {
  const sp = (window.STORY_DATA && window.STORY_DATA.speakers[speakerId]) || { name: '' };
  G.story.backlog.push({ speaker: sp.name || 'ANLATICI', color: sp.color || '#ffec82', text });
  if (G.story.backlog.length > 60) G.story.backlog.shift();
}

function advanceStory() {
  if (G.screen !== 'story') return;
  if (G.story.logOpen) { G.story.logOpen = false; return; }
  const node = getStoryNode();
  if (!node) { finishStoryScene(); return; }
  const fullText = node.text || '';
  if (G.story.charIdx < fullText.length) {
    G.story.charIdx = fullText.length;
    return;
  }
  if (node.choices && node.choices.length > 0) return;
  pushBacklog(node.speaker, fullText);
  if (node.end || !node.next) {
    playSfx('sfx_coin');
    finishStoryScene();
  } else {
    enterStoryNode(node.next);
  }
}

function chooseStoryOption(idx) {
  const node = getStoryNode();
  if (!node || !node.choices || !node.choices[idx]) return;
  const ch = node.choices[idx];
  pushBacklog(node.speaker, node.text || '');
  pushBacklog('hero', ch.text);
  if (ch.set) Object.assign(G.story.vars, ch.set);
  playSfx('sfx_coin');
  enterStoryNode(ch.to);
}

function updateStory(dt) {
  const node = getStoryNode();
  if (!node) return;
  G.story.nodeT += dt;
  const fullText = node.text || '';
  if (G.story.charIdx < fullText.length && !G.story.logOpen) {
    G.story.typeAcc += dt * 48; // crisp readable typewriter speed
    const prev = G.story.charIdx;
    G.story.charIdx = Math.min(fullText.length, Math.floor(G.story.typeAcc));
    if (G.story.charIdx > prev) {
      G.story.blipAcc += (G.story.charIdx - prev);
      const ch = fullText[G.story.charIdx - 1];
      if (G.story.blipAcc >= 3 && ch && ch !== ' ' && ch !== '.' && ch !== ',') {
        G.story.blipAcc = 0;
        playVoiceBlip(node.speaker);
      }
    }
  }
}

function getUpgradeCost(u) {
  const lvl = G.upLevels[u.id] || 0;
  const totalBought = Object.values(G.upLevels).reduce((a, b) => a + b, 0);
  let cost = u.baseCost + lvl * 22;
  if (totalBought === 0) {
    cost = Math.max(15, Math.round(cost * 0.6)); // %40 Esnaf Açılış İndirimi!
  }
  return cost;
}

function buyUpgrade(upId) {
  const u = UPGRADES.find(x => x.id === upId);
  if (!u) return;
  const lvl = G.upLevels[upId] || 0;
  if (lvl >= u.maxLvl) return;
  const cost = getUpgradeCost(u);
  if (G.gold < cost) { playSfx('sfx_hit'); return; }
  G.gold -= cost; G.upLevels[upId] = lvl + 1; playSfx('sfx_coin');
  if (upId === 'ayran_dmg') G.ayranDmg += 12;
  else if (upId === 'belt_cap') { G.maxAyran += 4; G.ayran = G.maxAyran; }
  else if (upId === 'kolonya_pow') { G.kolonyaDmg += 22; G.kolonyaRange += 24; G.kolonyaMaxCd = Math.max(1.3, G.kolonyaMaxCd - 0.22); }
  else if (upId === 'tea_heal') { G.maxHp += 15; G.hp = Math.min(G.maxHp, G.hp + 55); }
}

          });

        }
      }

    } else if (z.aiCd <= 0 && dist < 620) {
      if (z.bossSpecial === 'buffet' && z.hp < z.maxHp * 0.65) {

        z.aiState = 'telegraph'; z.aiTimer = 0.75; playSfx('sfx_horn');
        spawnFloat(z.x, z.y - 240, 'DÖNER ARABASI GELİYOR! ZIPLA!', 255, 205, 70, 22, 1.1);
        return;
      } else if (z.bossSpecial === 'quake') {
        z.aiState = 'telegraph'; z.aiTimer = 1.15; playSfx('sfx_horn');
        G.hazards.push({ type: 'quake_crack', x: z.x, w: 860, timer: 1.15, maxTimer: 1.15 });

      } else if (z.bossSpecial === 'hamsi') {
        z.aiState = 'telegraph'; z.aiTimer = 1.35; playSfx('sfx_horn');
        spawnFloat(z.x, z.y - 245, 'GÖKTEN HAMSİ YAĞMURU! KAÇ!', 255, 85, 75, 24, 1.35);
        const targets = [G.px, G.px - 145, G.px + 155, z.x + (G.px > z.x ? 220 : -220)];

          const cx = Math.max(100, Math.min(WORLD_W - 100, tx));

            type: 'hamsi_target', x: cx, timer: 1.35, maxTimer: 1.35, dmg: 22, impactDone: false
          });
        });
        return;
      }
    }
  }

  z.aiCd -= dt;
  const approachMul = (dist > 520 && z.aiState === 'chase') ? 1.65 : 1.0;

  if (z.ai === 'dasher') {
    if (z.aiState === 'telegraph') {
      z.aiTimer -= dt;
      if (z.aiTimer <= 0) {
        z.aiState = 'action'; z.aiTimer = 0.62; z.vx = z.facing * 560 * wetMul;
        spawnParticles(z.x, z.y - 18, 10, 255, 220, 110, 180, 140, 4, 8);
      }
      return;
    } else if (z.aiState === 'action') {
      z.aiTimer -= dt; z.x += z.vx * dt;

    } else if (z.aiCd <= 0 && dist > 140 && dist < 520) {
      z.facing = dir; z.aiState = 'telegraph'; z.aiTimer = 0.55; z.atkMaxTimer = 0.55; playSfx('sfx_horn');

      return;
    }
  } else if (z.ai === 'ranged') {
    z.facing = dir;
    if (z.aiState === 'telegraph') {
      z.aiTimer -= dt;
      if (z.aiTimer <= 0) {
        playSfx('sfx_throw');
        const startX = z.x + z.facing * 32, startY = z.y - 102;
        const targetX = G.px, targetY = G.py - 82;
        const eGrav = 380;
        const tFlight = Math.max(0.55, Math.min(1.25, Math.abs(targetX - startX) / 430));
        let pvx = (targetX - startX) / tFlight;
        const maxSpd = 540, minSpd = 260;
        pvx = z.facing * Math.max(minSpd, Math.min(maxSpd, Math.abs(pvx)));
        let pvy = (targetY - startY - 0.5 * eGrav * tFlight * tFlight) / tFlight;
        pvy = Math.max(-460, Math.min(-40, pvy));
        G.enemyProjs.push({
          x: startX, y: startY, vx: pvx, vy: pvy, grav: eGrav,
          rot: 0, dmg: z.dmg, label: z.projLabel, img: z.projImg,
          life: 2.3, r: 255, g: 190, b: 85
        });
        z.aiState = 'chase'; z.aiCd = 1.95 + Math.random() * 0.65;
      }
      return;
    } else {

      else if (dist > 500) z.x += dir * z.speed * approachMul * wetMul * dt;
      else if (z.aiCd <= 0) {
        z.aiState = 'telegraph'; z.aiTimer = 0.48; z.atkMaxTimer = 0.48;
        spawnFloat(z.x, z.y - 170, `${z.projLabel} GELİYOR!`, 255, 195, 95, 16, 0.65);

      return;
    }
  } else if (z.ai === 'heavy' && !z.isBoss) {
    if (z.aiState === 'telegraph') {
      z.aiTimer -= dt;
      if (z.aiTimer <= 0) {
        playSfx('sfx_prop'); spawnParticles(z.x + z.facing * 52, z.y - 75, 12, 255, 110, 95, 190, 240, 4, 8);
        if (dx * z.facing > -20 && dist < 148 && Math.abs(G.py - z.y) < 86) hurtPlayer(z.dmg, z.facing);
        z.aiState = 'chase'; z.aiCd = 1.35;
      }
      return;
    } else if (dist < 132 && z.aiCd <= 0) {
      z.facing = dir; z.aiState = 'telegraph'; z.aiTimer = 0.48; z.atkMaxTimer = 0.48; z.atkReach = 148;
      spawnFloat(z.x, z.y - 180, 'SAVURUYOR!', 255, 100, 100, 17, 0.6);
      return;
    }
  } else if (z.ai === 'flyer') {
    z.facing = dir; z.y = z.baseY + Math.sin(z.animT * 3.4) * 20;
    z.x += (dist > 110 ? (dir * z.speed * approachMul * wetMul + z.vx) : z.vx) * dt;
    if (z.aiCd <= 0 && dist < 440) {
      z.aiCd = 2.0;
      G.enemyProjs.push({
        x: z.x, y: z.y - 45,
        vx: Math.max(-280, Math.min(280, dx * 0.95)), vy: 40, grav: 240,
        rot: 0, dmg: z.dmg, label: z.projLabel, img: z.projImg, life: 2.2, r: 255, g: 125, b: 215
      });
    }
    if (dist < 62 && Math.abs(G.py - z.y) < 88) {
      z.atkCd -= dt; if (z.atkCd <= 0) { z.atkCd = 1.1; hurtPlayer(z.dmg, dir); }
    }
    return;
  }

  z.facing = dir;
  const stopDist = z.isBoss ? 104 : 86;
  const reach = z.isBoss ? 128 : 104;
  if (dist > stopDist && z.aiState !== 'windup') {
    z.x += (z.facing * z.speed * approachMul * wetMul + z.vx) * dt;
    z.aiState = 'chase';
  } else {
    z.x += z.vx * dt;
    z.atkCd -= dt;
    if (z.aiState !== 'windup' && z.atkCd <= 0) {
      z.aiState = 'windup';
      z.aiTimer = 0.34; z.atkMaxTimer = 0.34; z.atkReach = reach;
      spawnFloat(z.x, z.y - 170, '!', 255, 80, 80, 24, 0.36);
    }
    if (z.aiState === 'windup') {
      z.aiTimer -= dt;
      if (z.aiTimer <= 0) {
        z.aiState = 'chase';
        z.vx = z.facing * (z.isBoss ? 140 : 180);
        z.atkCd = z.isBoss ? 0.88 : 1.05;
        if (dx * z.facing > -15 && dist < reach && Math.abs(G.py - z.y) < 76) {
          hurtPlayer(z.dmg, z.facing);
        }
      }
    }
  }
}

function updatePlay(dt) {
  G.shakeClock += dt * 36;
  if (G.trauma > 0) G.trauma = Math.max(0, G.trauma - dt * 1.45);
  G.heroSX += (1 - G.heroSX) * Math.min(1, dt * 14);
  G.heroSY += (1 - G.heroSY) * Math.min(1, dt * 14);
  if (G.hitStop > 0) { G.hitStop -= dt; return; }

  const lvl = LEVELS[G.levelIdx];
  if (G.ayranCd > 0) G.ayranCd = Math.max(0, G.ayranCd - dt);
  if (G.kolonyaCd > 0) G.kolonyaCd = Math.max(0, G.kolonyaCd - dt);
  if (G.kolonyaVfxT > 0) G.kolonyaVfxT = Math.max(0, G.kolonyaVfxT - dt);
  if (G.nazarAnimT > 0) G.nazarAnimT = Math.max(0, G.nazarAnimT - dt);
  if (G.nazarCone) { G.nazarCone.life -= dt; if (G.nazarCone.life <= 0) G.nazarCone = null; }
  if (G.throwAnimT > 0) G.throwAnimT = Math.max(0, G.throwAnimT - dt);
  if (G.hitAnimT > 0) G.hitAnimT = Math.max(0, G.hitAnimT - dt);
  if (G.invulnT > 0) G.invulnT = Math.max(0, G.invulnT - dt);
  if (G.bossBannerT > 0) G.bossBannerT = Math.max(0, G.bossBannerT - dt);
  if (G.heroBarkCd > 0) G.heroBarkCd = Math.max(0, G.heroBarkCd - dt);
  if (G.dropThroughT > 0) G.dropThroughT = Math.max(0, G.dropThroughT - dt);
  if (G.coyoteT > 0) G.coyoteT = Math.max(0, G.coyoteT - dt);
  if (G.jumpBufT > 0) G.jumpBufT = Math.max(0, G.jumpBufT - dt);
  if (G.comboT > 0) { G.comboT -= dt; if (G.comboT <= 0) G.combo = 0; }

  if (G.ayran < G.maxAyran) {
    const regen = Math.max(0.55, 1.12 - (G.upLevels.belt_cap || 0) * 0.12);
    G.ayranRegenT += dt;
    if (G.ayranRegenT >= regen * 2.35) { G.ayranRegenT = 0; G.ayran++; }
  }

  if (G.bossDefeated) {
    G.levelClearT -= dt;
    if (G.levelClearT <= 0) {
      if (G.levelIdx === 0) {
        startStoryScene('l1_outro', () => { G.screen = 'shop'; });
      } else if (G.levelIdx === 1) {
        startStoryScene('l2_outro', () => { G.screen = 'shop'; });
      } else {
        startStoryScene('epilogue', () => { G.screen = 'victory'; playSfx('sfx_win'); });
      }
      return;
    }
  }

  let moveDir = 0;
  if (G.knockTimer > 0) {
    G.knockTimer -= dt;
    G.pvx *= Math.max(0, 1 - dt * 5.5);
  } else {
    if (G.keys['KeyA'] || G.keys['ArrowLeft'] || G.holdLeft) moveDir -= 1;
    if (G.keys['KeyD'] || G.keys['ArrowRight'] || G.holdRight) moveDir += 1;
    const sprint = !!(G.keys['ShiftLeft'] || G.keys['ShiftRight']);
    const maxSpd = sprint ? 420 : 295;
    if (moveDir !== 0) {
      G.facing = moveDir; G.pvx = moveDir * maxSpd;
      G.walkT += dt * (sprint ? 1.45 : 1.0);
      if (G.onGround && Math.random() < (sprint ? 0.35 : 0.14)) spawnParticles(G.px - moveDir * 24, G.py - 5, 1, 210, 195, 165, 55, 60, 4, 8);
    } else {
      G.pvx *= Math.max(0, 1 - dt * 14);
    }
  }
  G.px = Math.max(70, Math.min(WORLD_W - 70, G.px + G.pvx * dt));

  const wasGrounded = G.onGround;
  const prevPy = G.py;
  G.pvy += 1720 * dt; G.py += G.pvy * dt;
  G.onGround = false; G.onPlatform = false;

  if (G.pvy >= 0 && G.dropThroughT <= 0) {
    for (const p of G.props) {
      const pm = PROP_META[p.kind] || PROP_META.simit;
      const propTopY = GROUND_Y - pm.topH;
      if (p.state < 2 && Math.abs(G.px - p.x) < pm.halfW && prevPy <= propTopY + 18 && G.py >= propTopY) {
        G.py = propTopY; G.pvy = 0; G.onGround = true; G.onPlatform = true; G.platY = propTopY;
        G.jumpsLeft = 1 + ((G.upLevels.belt_cap || 0) >= 1 ? 1 : 0);
        if (!wasGrounded) {
          G.heroSX = 1.20; G.heroSY = 0.82; p.shake = 0.14; spawnParticles(G.px, propTopY, 5, 255, 230, 165, 90, 120, 3, 6);
          if (!G.highGroundTipShown && G.levelIdx === 0) {
            G.highGroundTipShown = true;
            spawnFloat(G.px, G.py - 155, 'YÜKSEK AVANTAJ! +%45 MENZİL!', 110, 245, 255, 17, 1.35);
          }
        }
        break;
      }
    }
  }
  if (!G.onGround && G.py >= GROUND_Y) {
    G.py = GROUND_Y; G.pvy = 0; G.onGround = true;
    G.jumpsLeft = 1 + ((G.upLevels.belt_cap || 0) >= 1 ? 1 : 0);
    if (!wasGrounded) { G.heroSX = 1.22; G.heroSY = 0.80; spawnParticles(G.px, GROUND_Y - 4, 6, 220, 205, 180, 95, 120, 4, 7); }
  }
  if (wasGrounded && !G.onGround && G.pvy >= 0) G.coyoteT = 0.11;
  if (G.jumpBufT > 0 && (G.onGround || G.coyoteT > 0)) executeJump();

  const targetCam = Math.max(0, Math.min(WORLD_W - VW, G.px - VW * 0.42 + G.facing * 55));
  G.camX += (targetCam - G.camX) * Math.min(1, dt * 6.5);

  if (!G.bossDefeated) {
    if (G.calmedInLevel >= lvl.goal && !G.bossSpawned) spawnZombie(true);
    else if (!G.bossSpawned) {

      const active = G.zombies.filter(z => !z.calmed).length;
      const maxActive = G.levelIdx === 0 ? 4 : (G.levelIdx === 1 ? 5 : 6);
      if (G.spawnT <= 0 && active < maxActive) {

  }

  // Player projectiles
  G.projectiles = G.projectiles.filter(pr => {
    pr.life -= dt; pr.vy += (pr.grav || 920) * dt; pr.x += pr.vx * dt; pr.y += pr.vy * dt; pr.rot += pr.facing * 14 * dt;
    for (const z of G.zombies) {
      if (z.calmed) continue;
      const hitW = z.isBoss ? 76 : 50, hitH = z.isBoss ? 190 : 150;
      if (Math.abs(pr.x - z.x) < hitW && pr.y > z.y - hitH && pr.y < z.y + 18) {
        const isStunned = z.stunT > 0;
        const dealtDmg = isStunned ? Math.floor(pr.dmg * 1.5) : pr.dmg;
        z.hp -= dealtDmg; z.wetT = 3.5; z.hitFlash = 0.16; z.squashX = 1.18; z.squashY = 0.85;
        spawnVfxSprite('vfx_splash_ayran', pr.x, pr.y - 10, 78, 68, 0.40);
        z.vx = pr.facing * (z.isBoss ? 95 : 190);
        if (z.isBoss && z.aiState === 'channel') {
          z.channelHits++;
          if (z.channelHits >= 2) {
            z.aiState = 'chase'; z.aiCd = 6.0; z.stunT = 2.5;
            spawnFloat(z.x, z.y - 220, 'AYRANLA BÜFE İPTAL! SERSEMLEDİ! +60 ₺', 110, 238, 255, 22, 1.4);
            spawnPickup('coin', z.x - 35, z.y - 60, 20);
            spawnPickup('coin', z.x + 35, z.y - 60, 20);
            spawnPickup('coin', z.x, z.y - 90, 20);
            playSfx('sfx_coin');
          }
        }
        playSfx('sfx_splash'); addTrauma(0.12);
        spawnParticles(pr.x, pr.y, 15, 242, 252, 255, 220, 320, 4, 9);
        if (pr.splashRad > 0) {
          spawnShockwave(pr.x, pr.y, pr.splashRad, 220, 248, 255, 0.28);
          for (const oz of G.zombies) {
            if (oz !== z && !oz.calmed && Math.abs(oz.x - pr.x) < pr.splashRad) {
              oz.hp -= Math.floor(pr.dmg * 0.5); oz.wetT = 4.5; oz.hitFlash = 0.12;
              if (oz.hp <= 0) calmZombie(oz);
            }
          }
        }
        if (z.hp <= 0) calmZombie(z);
        else spawnFloat(z.x, z.y - 135, isStunned ? `-${dealtDmg} SERSEM KRİTİK!` : (pr.fromHigh ? `YÜKSEKTEN! -${dealtDmg}` : `-${dealtDmg} ISLAK!`), isStunned ? 255 : (pr.fromHigh ? 105 : 145), 238, 255, 18, 0.72);
        return false;
      }
    }
    // Ayran flies past street props to hit enemies behind cover
    if (pr.y >= GROUND_Y - 10) { playSfx('sfx_splash'); spawnParticles(pr.x, GROUND_Y - 10, 9, 240, 252, 255, 160, 260, 3, 7); return false; }
    return pr.life > 0;
  });

  // Enemy projectiles
  G.enemyProjs = G.enemyProjs.filter(ep => {
    ep.life -= dt; ep.vy += (ep.grav || 380) * dt; ep.x += ep.vx * dt; ep.y += ep.vy * dt; ep.rot += 9 * dt;
    // TACTICAL COVER: Prop blocks enemy projectiles!
    for (const p of G.props) {
      if (p.state < 2 && Math.abs(ep.x - p.x) < 44 && ep.y > GROUND_Y - 110 && ep.y < GROUND_Y) {
        damageProp(p);
        spawnParticles(ep.x, ep.y, 8, 240, 195, 120, 160, 200, 3, 6);
        spawnFloat(p.x, GROUND_Y - 130, 'SİPER! BLOKLANDI!', 120, 245, 255, 16, 0.75);
        if (ep.img === 'proj_sicak_cay') spawnVfxSprite('vfx_puddle_tea', ep.x, GROUND_Y - 8, 64, 28, 2.2);
        else if (ep.img === 'proj_curuk_domates') spawnVfxSprite('vfx_splat_tomato', ep.x, GROUND_Y - 8, 60, 26, 2.0);
        return false;
      }
    }
    if (Math.abs(ep.x - G.px) < 38 && ep.y > G.py - 145 && ep.y < G.py - 10) {
      hurtPlayer(ep.dmg, ep.vx >= 0 ? 1 : -1); return false;
    }
    if (ep.y >= GROUND_Y - 6) {
      spawnParticles(ep.x, GROUND_Y - 8, 6, ep.r, ep.g, ep.b, 120, 220, 3, 6);
      if (ep.img === 'proj_sicak_cay') spawnGroundHazard('tea_spill', ep.x, 44, 3.2, 8);
      else if (ep.img === 'proj_zehirli_dondurma') spawnGroundHazard('heat_pool', ep.x, 52, 4.5, 10);
      else if (ep.img === 'proj_kamp_feneri' || ep.img === 'proj_zehirli_kokteyl') spawnGroundHazard('fire_zone', ep.x, 58, 4.0, 13);
      return false;
    }
    return ep.life > 0;
  });

  // Zombies
  G.zombies = G.zombies.filter(z => {
    z.animT += dt;
    z.squashX += (1 - z.squashX) * Math.min(1, dt * 12);
    z.squashY += (1 - z.squashY) * Math.min(1, dt * 12);
    if (z.hitFlash > 0) z.hitFlash = Math.max(0, z.hitFlash - dt);
    if (z.wetT > 0) {
      z.wetT = Math.max(0, z.wetT - dt);
      if (Math.random() < 0.16) spawnParticles(z.x, z.y - 95, 1, 220, 248, 255, 45, 260, 3, 5);
    }
    if (z.stunT > 0) z.stunT = Math.max(0, z.stunT - dt);
    z.vx *= Math.max(0, 1 - dt * 8);
    if (z.calmed) {
      z.cureT = (z.cureT || 0) + dt;
      z.calmT -= dt;
      if (z.ai === 'flyer') z.y += (GROUND_Y - z.y) * Math.min(1, dt * 5.5);
      // Peak reveal at 0.43s (slot 6 — ayran-mustache smiling human emerges from foam!)
      if (!z.curePopDone && z.cureT >= 0.43) {
        z.curePopDone = true;
        z.squashX = 1.20; z.squashY = 0.84;
        spawnParticles(z.x, z.y - 105, z.isBoss ? 34 : 16, 255, 240, 120, 250, 240, 4, 8);

    }
    if (z.stunT > 0) z.x += z.vx * dt; else updateZombieAI(z, dt);
    z.x = Math.max(40, Math.min(WORLD_W - 40, z.x));
    return true;
  });

  for (const p of G.props) if (p.shake > 0) p.shake = Math.max(0, p.shake - dt);

  G.pickups = G.pickups.filter(pk => {
    pk.life -= dt; pk.vy += 880 * dt; pk.y += pk.vy * dt;
    if (pk.y > GROUND_Y - 22) { pk.y = GROUND_Y - 22; pk.vy = 0; }
    const dx = G.px - pk.x, dy = (G.py - 75) - pk.y;
    const d = Math.hypot(dx, dy);
    if (d < 185) { pk.x += (dx / Math.max(1, d)) * 490 * dt; pk.y += (dy / Math.max(1, d)) * 490 * dt; }
    if (d < 48) {
      playSfx('sfx_coin');
      if (pk.kind === 'coin') { G.gold += pk.val; spawnFloat(pk.x, pk.y - 30, `+${pk.val} ₺`, 255, 220, 75, 19, 0.85); }
      else if (pk.kind === 'ayran') { G.ayran = Math.min(G.maxAyran, G.ayran + pk.val); spawnFloat(pk.x, pk.y - 30, `+${pk.val} AYRAN!`, 125, 230, 255, 19, 0.85); }
      else { G.hp = Math.min(G.maxHp, G.hp + pk.val); spawnFloat(pk.x, pk.y - 30, `+${pk.val} ÇAY CANI!`, 120, 255, 155, 19, 0.85); }
      return false;
    }
    return pk.life > 0;
  });

  G.particles = G.particles.filter(pt => { pt.life -= dt; pt.vy += pt.grav * dt; pt.x += pt.vx * dt; pt.y += pt.vy * dt; return pt.life > 0; });
  G.floats = G.floats.filter(fl => { fl.life -= dt; fl.y += fl.vy * dt; return fl.life > 0; });
  G.waves = G.waves.filter(sw => { sw.life -= dt; sw.rad = 24 + (sw.maxRad - 24) * (1 - sw.life / sw.maxLife); return sw.life > 0; });

  // Boss Hazards Update
  G.hazards = G.hazards.filter(hz => {
    hz.timer -= dt;
    if (hz.type === 'hamsi_target') {
      if (hz.timer <= 0 && !hz.impactDone) {
        hz.impactDone = true;
        playSfx('sfx_splash');
        addTrauma(0.35);
        spawnVfxSprite('vfx_splash_ayran', hz.x, GROUND_Y - 24, 110, 90, 0.45);
        spawnShockwave(hz.x, GROUND_Y - 14, 140, 90, 200, 255, 0.35, true);
        spawnParticles(hz.x, GROUND_Y - 20, 16, 120, 220, 255, 260, 220, 4, 8);
        const pDist = Math.abs(G.px - hz.x);
        if (pDist < 70 && (G.onGround && !G.onPlatform && G.py >= GROUND_Y - 26)) {
          hurtPlayer(hz.dmg || 22, G.px >= hz.x ? 1 : -1);
        } else if (pDist < 88 && G.onPlatform) {
          spawnFloat(G.px, G.py - 140, 'TEZGAHTA ISLANMADIN! +80', 100, 240, 255, 17, 0.9);
          G.score += 80;
        }
      }
      return hz.timer > -0.3;
    } else if (hz.type === 'buffet_rush') {
      hz.x += hz.vx * dt;
      hz.trailAcc = (hz.trailAcc || 0) + dt;
      if (hz.trailAcc >= 0.38) {
        hz.trailAcc = 0;
        spawnGroundHazard('fire_zone', hz.x, 56, 2.8, 12);
      }
      if (Math.abs(G.px - hz.x) < 54 && G.py >= GROUND_Y - 48) {
        hurtPlayer(hz.dmg || 24, hz.vx > 0 ? 1 : -1);
        hz.timer = -1;
      }
      return hz.x > -200 && hz.x < WORLD_W + 200 && hz.timer > 0;
    } else if (hz.type === 'tea_spill' || hz.type === 'heat_pool' || hz.type === 'fire_zone') {
      if (hz.tickCd > 0) hz.tickCd -= dt;
      if (G.onGround && !G.onPlatform && G.py >= GROUND_Y - 22 && Math.abs(G.px - hz.x) < hz.halfW) {
        G.pvx *= 0.88;
        if (hz.tickCd <= 0) {
          hz.tickCd = 0.78;
          hurtPlayer(hz.dmg, G.px >= hz.x ? 1 : -1);
        }
      }
      return hz.timer > 0;
    }
    return hz.timer > 0;
  });
}

function addZone(id, x, y, w, h) { G.zones.push({ id, x, y, w, h }); }

function roundRect(x, y, w, h, r) {
  const cr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + cr, y);
  ctx.arcTo(x + w, y, x + w, y + h, cr);
  ctx.arcTo(x + w, y + h, x, y + h, cr);
  ctx.arcTo(x, y + h, x, y, cr);
  ctx.arcTo(x, y, x + w, y, cr);
  ctx.closePath();
}
function fillRectR(x, y, w, h, r, col) { roundRect(x, y, w, h, r); ctx.fillStyle = col; ctx.fill(); }
function strokeRectR(x, y, w, h, r, col, lw) { roundRect(x, y, w, h, r); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.stroke(); }

function drawLabel(str, x, y, size, col, align = 'center', bold = true) {
  ctx.font = `${bold ? '800' : '700'} ${size}px ${bold ? 'BalooBold' : 'BalooMed'}, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = col; ctx.fillText(str, x, y);
}
function drawOutlined(str, x, y, size, col, align = 'center', bold = true) {
  ctx.font = `${bold ? '800' : '700'} ${size}px ${bold ? 'BalooBold' : 'BalooMed'}, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#16121e'; ctx.lineWidth = Math.max(3, size * 0.19);
  ctx.strokeText(str, x, y + 1.5);
  ctx.fillStyle = col; ctx.fillText(str, x, y);
}

function drawImgBox(id, x, y, w, h, alpha = 1) {
  const im = images[id];
  if (!im || !im.complete || im.naturalWidth === 0) return;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.drawImage(im, x, y, w, h);
  ctx.restore();
}
function drawImgCenter(id, cx, cy, targetH, rot = 0, alpha = 1) {
  const im = images[id];
  if (!im || !im.complete || im.naturalWidth === 0) return;
  const k = targetH / im.naturalHeight;
  const w = im.naturalWidth * k, h = targetH;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(cx, cy); if (rot) ctx.rotate(rot);
  ctx.drawImage(im, -w / 2, -h / 2, w, h);
  ctx.restore();
}
function drawImgFoot(id, fx, fy, targetH, flip = 1, sx = 1, sy = 1, rot = 0, alpha = 1) {
  const im = images[id];
  if (!im || !im.complete || im.naturalWidth === 0) return;
  const k = targetH / im.naturalHeight;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(fx, fy); if (rot) ctx.rotate(rot);
  ctx.scale(k * flip * sx, k * sy);
  ctx.drawImage(im, -im.naturalWidth / 2, -im.naturalHeight);
  ctx.restore();
}
const SHEET_META = {
  hero_nazar:   { cols: 4, rows: 3, anchorX: 0.30, anchorY: 0.92 },
  hero_cologne: { cols: 4, rows: 3, anchorX: 0.30, anchorY: 0.92 },
};
function drawSheetFrame(id, cols, slot, fx, fy, targetH, flip = 1, sx = 1, sy = 1, rot = 0, alpha = 1) {
  const im = images[id];
  if (!im || !im.complete || im.naturalWidth === 0) return;
  const meta = SHEET_META[id];
  const cCount = meta ? meta.cols : cols;
  const cellW = im.naturalWidth / cCount;
  const cellH = meta ? (im.naturalHeight / meta.rows) : cellW;
  const ax = meta ? meta.anchorX : 0.5;
  const ay = meta ? meta.anchorY : 0.92;
  const s = Math.max(0, Math.floor(slot));
  const col = s % cCount, row = Math.floor(s / cCount);
  const k = targetH / cellH;
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(fx, fy); if (rot) ctx.rotate(rot);
  ctx.scale(k * flip * sx, k * sy);
  ctx.drawImage(im, col * cellW + 1, row * cellH + 1, cellW - 2, cellH - 2, -cellW * ax, -cellH * ay, cellW, cellH);
  ctx.restore();
}

function drawWoodenModal(x, y, w, h) {
  const headH = Math.max(82, Math.min(126, w * 0.118));
  drawImgBox('ui_board_wood', x + w * 0.015, y + headH * 0.56, w * 0.97, h - headH * 0.56);
  drawImgBox('ui_header_plank', x, y, w, headH);
}
function drawGoldBtn(zoneId, cx, cy, w, h, text, fontSize, showPlay = true) {
  const hov = G.hover === zoneId;
  const idlePulse = zoneId === 'btn_start' ? Math.sin(G.time * 3.6) * 0.025 : 0;
  const sc = (hov ? 1.055 : 1.0) + idlePulse;
  const bw = w * sc, bh = h * sc;
  const bx = cx - bw / 2, by = cy - bh / 2 + (hov ? -2 : 0);
  
  if (zoneId === 'btn_start') {
    ctx.save();
    ctx.shadowColor = hov ? '#4ee6ff' : '#ffb833';
    ctx.shadowBlur = hov ? 22 : 12;
    fillRectR(bx - 4, by - 2, bw + 8, bh + 4, 32, hov ? 'rgba(78,230,255,0.22)' : 'rgba(255,184,51,0.18)');
    ctx.restore();
  }

  if (showPlay) {
    const col = hov ? '#ffe05c' : 'rgba(255,224,92,0.82)';
    fillRectR(bx - 22, cy - 10, 14, 5, 3, col);
    fillRectR(bx - 26, cy + 7, 16, 5, 3, col);
    fillRectR(bx + bw + 8, cy - 10, 14, 5, 3, col);
    fillRectR(bx + bw + 10, cy + 7, 16, 5, 3, col);
  }
  drawImgBox('ui_btn_gold', bx, by, bw, bh);
  const ty = by + bh * 0.56;
  if (showPlay) {
    const ih = fontSize * 0.96, iw = ih * 0.75;
    const tx = cx - (text.length * fontSize * 0.28) - 16;
    drawImgBox('ui_play_icon', tx - iw / 2, ty - ih / 2, iw, ih);
    drawLabel(text, cx + 16, ty + 2, fontSize, 'rgba(255,232,140,0.55)', 'center', true);
    drawLabel(text, cx + 16, ty, fontSize, '#3e1806', 'center', true);
  } else {
    drawLabel(text, cx, ty, fontSize, '#3e1806', 'center', true);
  }
  addZone(zoneId, cx - w / 2, cy - h / 2, w, h);
}
function drawWoodPad(x, y, w, h) {
  fillRectR(x, y + 4, w, h, 12, 'rgba(16,12,24,0.82)');
  fillRectR(x, y, w, h, 12, '#7c4826');
  fillRectR(x + 4, y + 3, w - 8, h * 0.36, 8, 'rgba(156,96,52,0.65)');
  strokeRectR(x, y, w, h, 12, '#18121e', 3.2);
}
function drawSpeechBubble(str, cx, cy, size, alpha) {
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.font = `800 ${size}px BalooBold, "Arial Black", sans-serif`;
  const maxLineW = 360;
  let lines = [str];
  if (ctx.measureText(str).width > maxLineW) {
    const words = str.split(' ');
    lines = [''];
    for (const w of words) {
      const cand = lines[lines.length - 1] ? lines[lines.length - 1] + ' ' + w : w;
      if (lines[lines.length - 1] && ctx.measureText(cand).width > maxLineW) lines.push(w);
      else lines[lines.length - 1] = cand;
    }
  }
  const textW = Math.max(...lines.map(l => ctx.measureText(l).width));
  const bw = Math.max(124, Math.ceil(textW) + 30);
  const lineH = size + 5;
  const bh = lines.length * lineH + 16;
  const bx = Math.max(14, Math.min(VW - bw - 14, cx - bw / 2));
  const by = cy - bh / 2;
  const tx = Math.max(bx + 18, Math.min(bx + bw - 18, cx));
  fillRectR(bx + 2, by + 3, bw, bh, 12, 'rgba(18,14,28,0.75)');
  fillRectR(bx, by, bw, bh, 12, '#fffdf4');
  strokeRectR(bx, by, bw, bh, 12, '#161420', 2.5);
  ctx.beginPath(); ctx.moveTo(tx - 8, by + bh - 1); ctx.lineTo(tx + 8, by + bh - 1); ctx.lineTo(tx, by + bh + 9); ctx.closePath();
  ctx.fillStyle = '#fffdf4'; ctx.fill();
  lines.forEach((l, li) => {
    const ly = by + 8 + lineH * (li + 0.5);
    drawLabel(l, bx + bw / 2, ly, size, '#181622', 'center', true);
  });
  ctx.restore();
}

function drawWorld() {
  const lvl = LEVELS[G.levelIdx];
  const sh = G.trauma * G.trauma;
  const sx = 18 * sh * Math.sin(G.shakeClock * 1.7);
  const sy = 12 * sh * Math.sin(G.shakeClock * 2.3);

  ctx.save();
  ctx.translate(-G.camX + sx, sy);

  // Extended 3840x720 Street Panorama + Live Time-of-Day Atmospheric Lighting
  drawImgBox(lvl.bg, 0, 0, WORLD_W, VH);
  if (G.levelIdx === 0) {
    // Noon (13:30): 3 soft diagonal Mediterranean sunbeams at 0.15x parallax
    for (let bi = -1; bi < 4; bi++) {
      const bxTop = G.camX * 0.85 + 240 + bi * 390;
      const bxBot = bxTop - 190;
      const beamG = ctx.createLinearGradient(bxTop, 0, bxBot, GROUND_Y);
      beamG.addColorStop(0, 'rgba(255, 248, 205, 0.085)');
      beamG.addColorStop(0.7, 'rgba(255, 248, 205, 0.03)');
      beamG.addColorStop(1, 'rgba(255, 248, 205, 0)');
      ctx.fillStyle = beamG;
      ctx.beginPath();
      ctx.moveTo(bxTop, 0);
      ctx.lineTo(bxTop + 145, 0);
      ctx.lineTo(bxBot + 295, GROUND_Y);
      ctx.lineTo(bxBot, GROUND_Y);
      ctx.closePath();
      ctx.fill();
    }
  } else if (G.levelIdx === 1) {
    // İkindi Sunset (17:45): warm coral-amber horizon bloom + 2 low afternoon shafts
    const sunG = ctx.createLinearGradient(0, 40, 0, GROUND_Y);
    sunG.addColorStop(0, 'rgba(255, 138, 66, 0.02)');
    sunG.addColorStop(0.45, 'rgba(255, 138, 66, 0.13)');
    sunG.addColorStop(1, 'rgba(255, 138, 66, 0)');
    ctx.fillStyle = sunG;
    ctx.fillRect(G.camX, 0, VW, GROUND_Y);
    for (let bi = 0; bi < 3; bi++) {
      const bxTop = G.camX * 0.85 + 280 + bi * 520;
      const bxBot = bxTop - 320;
      const shaftG = ctx.createLinearGradient(bxTop, 0, bxBot, GROUND_Y);
      shaftG.addColorStop(0, 'rgba(255, 178, 92, 0.09)');
      shaftG.addColorStop(1, 'rgba(255, 178, 92, 0)');
      ctx.fillStyle = shaftG;
      ctx.beginPath();
      ctx.moveTo(bxTop, 0);
      ctx.lineTo(bxTop + 170, 0);
      ctx.lineTo(bxBot + 340, GROUND_Y);
      ctx.lineTo(bxBot, GROUND_Y);
      ctx.closePath();
      ctx.fill();
    }
  }

  // Ground VFX Splats
  if (G.vfxSprites && G.vfxSprites.length > 0) {
    G.vfxSprites = G.vfxSprites.filter(v => {
      if (G.screen === 'play') v.life -= (G.dt || 0.016);
      if (v.life <= 0) return false;
      const alpha = Math.min(1.0, v.life / (v.maxLife * 0.35));
      drawImgBox(v.img, v.x - v.w / 2, v.y - v.h / 2, v.w, v.h, alpha);
      return true;
    });
  }

  // Street props (calibrated real-world scale, 0px ground gap, double contact shadow!)
  for (const p of G.props) {
    const pm = PROP_META[p.kind] || PROP_META.simit;
    const propTopY = GROUND_Y - pm.topH;
    const pid = `p_${p.kind}_${p.state}`;
    const pH = p.state === 2 ? pm.brokenH : pm.h;
    const psh = p.shake > 0 ? Math.sin(G.time * 55) * 5 : 0;
    const sw = p.state === 2 ? pm.shadowW * 0.92 : pm.shadowW;
    // Outer soft ambient ground shadow
    ctx.fillStyle = 'rgba(10, 8, 22, 0.34)';
    ctx.beginPath(); ctx.ellipse(p.x, GROUND_Y + 3, sw * 1.18, 13, 0, 0, Math.PI * 2); ctx.fill();
    // Tight dark contact occlusion shadow right under wheels/legs
    ctx.fillStyle = 'rgba(8, 6, 18, 0.62)';
    ctx.beginPath(); ctx.ellipse(p.x, GROUND_Y + 1, sw * 0.84, 7.5, 0, 0, Math.PI * 2); ctx.fill();
    drawImgFoot(pid, p.x + psh, GROUND_Y + 2, pH);
    if (p.state < 2 && Math.abs(G.px - p.x) < 220) {
      const barW = pm.halfW * 1.3;
      fillRectR(p.x - barW / 2, propTopY - 2, barW, 4, 2, 'rgba(120,240,255,0.44)');
    }
  }

  // Pickups
  for (const pk of G.pickups) {
    const blink = (pk.life < 2.0 && Math.floor(G.time * 16) % 2 === 0) ? 0.35 : 1.0;
    const bob = Math.sin(G.time * 6.5 + pk.x) * 6;
    const ic = pk.kind === 'coin' ? 'ui_coin' : (pk.kind === 'ayran' ? 'ui_ayran_icon' : 'ui_heart');
    drawImgCenter(ic, pk.x, pk.y + bob, pk.kind === 'ayran' ? 42 : 38, 0, blink);
  }

  // Zombies
  for (const z of G.zombies) {
    const targetH = 166 * z.scale;
    const t = z.cureT || 0;
    const holdEnd = z.isBoss ? 2.55 : 1.90;
    const op = z.calmed ? Math.min(1, z.calmT / 0.65) : 1;

    ctx.fillStyle = `rgba(12,10,22,${0.52 * op})`;
    const shS = z.ai === 'flyer' ? 0.65 : 1;
    ctx.beginPath(); ctx.ellipse(z.x, GROUND_Y + 4, 42 * z.scale * shS, 12 * z.scale * shS, 0, 0, Math.PI * 2); ctx.fill();

    if (!z.calmed) {
      const bob = z.ai === 'flyer' ? 0 : Math.abs(Math.sin(z.animT * 6.8)) * 7;
      let tilt = Math.sin(z.animT * 6.8) * 0.06 * z.facing;
      if (z.aiState === 'telegraph') tilt = -0.18 * z.facing;
      else if (z.aiState === 'action') tilt = 0.22 * z.facing;

      // Visible Attack Threat Arc & Dash Corridor Telegraphs
      if (z.aiState === 'windup' || (z.ai === 'heavy' && !z.isBoss && z.aiState === 'telegraph')) {
        const reach = z.atkReach || (z.isBoss ? 128 : 104);
        const maxT = z.atkMaxTimer || 0.36;
        const prog = Math.max(0.05, Math.min(1, 1 - (z.aiTimer / maxT)));
        const cy = z.y - 76;
        const baseAng = z.facing > 0 ? 0 : Math.PI;
        ctx.save();
        ctx.fillStyle = 'rgba(255, 55, 45, 0.24)';
        ctx.beginPath(); ctx.moveTo(z.x, cy); ctx.arc(z.x, cy, reach, baseAng - 0.72, baseAng + 0.72); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255, 40, 35, 0.42)';
        ctx.beginPath(); ctx.moveTo(z.x, cy); ctx.arc(z.x, cy, reach * prog, baseAng - 0.72, baseAng + 0.72); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(255, 95, 80, 0.92)'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(z.x, cy); ctx.arc(z.x, cy, reach, baseAng - 0.72, baseAng + 0.72); ctx.closePath(); ctx.stroke();
        ctx.restore();
      } else if (z.ai === 'dasher' && z.aiState === 'telegraph') {
        const pulse = 0.42 + 0.3 * Math.sin(G.time * 24);
        const startX = z.x, endX = z.x + z.facing * 340;
        const rx = Math.min(startX, endX), rw = Math.abs(endX - startX);
        ctx.save();
        fillRectR(rx, GROUND_Y - 14, rw, 14, 6, `rgba(255, 115, 35, ${pulse * 0.45})`);
        ctx.strokeStyle = `rgba(255, 200, 65, ${pulse})`; ctx.lineWidth = 2.5; ctx.setLineDash([12, 8]);
        ctx.strokeRect(rx, GROUND_Y - 14, rw, 14);
        ctx.setLineDash([]);
        drawOutlined(z.facing > 0 ? '▶▶▶' : '◀◀◀', z.x + z.facing * 165, GROUND_Y - 26, 15, '#ffd85c');
        ctx.restore();
      }

      if (z.stunT > 0 && z.wetT > 0) {
        ctx.save();
        ctx.fillStyle = 'rgba(110, 240, 255, 0.34)';
        ctx.beginPath(); ctx.ellipse(z.x, z.y - targetH * 0.45, 58 * z.scale, 78 * z.scale, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(155, 250, 255, 0.78)'; ctx.lineWidth = 2.5; ctx.stroke();
        ctx.restore();
      } else if (z.aiState === 'telegraph') {
        ctx.fillStyle = 'rgba(255,65,55,0.34)';
        ctx.beginPath(); ctx.ellipse(z.x, z.y - targetH * 0.45, 68 * z.scale, 84 * z.scale, 0, 0, Math.PI * 2); ctx.fill();
        if (z.isBoss && z.bossSpecial === 'quake') fillRectR(z.x - 420, GROUND_Y - 12, 840, 18, 6, 'rgba(255,65,55,0.44)');
      } else if (z.aiState === 'channel') {
        ctx.fillStyle = 'rgba(90,255,130,0.32)';
        ctx.beginPath(); ctx.arc(z.x, z.y - targetH * 0.5, 95 + Math.sin(G.time * 12) * 12, 0, Math.PI * 2); ctx.fill();
      } else if (z.wetT > 0) {
        ctx.fillStyle = 'rgba(125,235,255,0.36)';
        ctx.beginPath(); ctx.ellipse(z.x, z.y - targetH * 0.45, 52 * z.scale, 72 * z.scale, 0, 0, Math.PI * 2); ctx.fill();
      }

      const slot = z.hitFlash > 0 ? (12 + (Math.floor((0.24 - z.hitFlash) * 20) % 4)) : (Math.floor(z.animT * 10) % 12);
      drawSheetFrame(z.img, 4, slot, z.x, z.y - bob * 0.25, 216 * z.scale, z.facing, z.squashX, z.squashY, tilt * 0.45, 1);

      const topY = z.y - targetH - 18;
      if (!z.isBoss && z.hp < z.maxHp) {
        fillRectR(z.x - 33, topY, 66, 9, 4, 'rgba(22,18,34,0.88)');
        fillRectR(z.x - 31, topY + 2, Math.max(0, 62 * (z.hp / z.maxHp)), 5, 2, z.wetT > 0 ? '#5fe4ff' : '#78f569');
      }
      if (z.wetT > 0) drawOutlined(z.stunT > 0 ? (IS_TOUCH ? 'DONDU! ŞOK!' : 'DONDU! [K]') : (IS_TOUCH ? 'ISLAK! ŞOK!' : 'ISLAK! [K]'), z.x, topY - 14, 13, '#7df0ff');
      if (z.stunT > 0) {
        for (let si = 0; si < 3; si++) {
          const a = G.time * 7 + si * 2.094;
          ctx.fillStyle = '#ffe650'; ctx.beginPath(); ctx.arc(z.x + Math.cos(a) * 28, topY - 4 + Math.sin(a) * 7, 5, 0, Math.PI * 2); ctx.fill();
        }
      }
    } else {
      const curedId = 'c_' + z.img.slice(2);
      const hasCured = images[curedId] && images[curedId].complete && images[curedId].naturalWidth > 0;
      const cSlot = Math.min(11, Math.floor(t * 14));
      let cBob = 0, cTilt = 0;
      if (t >= 0.86 && t <= holdEnd) {
        cBob = Math.abs(Math.sin((t - 0.86) * 7.5)) * 5;
        cTilt = Math.sin((t - 0.86) * 7.5) * 0.04;
      } else if (t > holdEnd) {
        cBob = Math.abs(Math.sin((t - holdEnd) * 11)) * 10;
        cTilt = 0.05 * (-z.facing);
      }
      const flip = (t <= holdEnd) ? z.facing : -z.facing;
      const auraA = Math.min(1, Math.max(0, (t - 0.32) / 0.35)) * 0.34 * op;
      if (auraA > 0.01) {
        ctx.fillStyle = `rgba(255,235,110,${auraA})`;
        ctx.beginPath(); ctx.ellipse(z.x, z.y - targetH * 0.45, 58 * z.scale, 72 * z.scale, 0, 0, Math.PI * 2); ctx.fill();
      }
      drawSheetFrame(hasCured ? curedId : z.img, 4, hasCured ? cSlot : (Math.floor(z.animT * 14) % 12), z.x, z.y - cBob, 216 * z.scale, flip, z.squashX, z.squashY, cTilt, op);
    }
  }

  // Ground Boss Hazards (Quake fissures, Hamsi reticles, Buffet cart)
  for (const hz of G.hazards) {
    if (hz.type === 'quake_crack') {
      const alpha = Math.min(1, hz.timer / 0.3) * (0.65 + 0.35 * Math.sin(G.time * 16));
      ctx.strokeStyle = `rgba(255, 60, 45, ${alpha})`;
      ctx.lineWidth = 7;
      ctx.setLineDash([18, 10]);
      ctx.beginPath();
      ctx.moveTo(hz.x - hz.w / 2, GROUND_Y - 2);
      ctx.lineTo(hz.x + hz.w / 2, GROUND_Y - 2);
      ctx.stroke();
      ctx.setLineDash([]);
      drawOutlined('⚠️ DEPREM TEHLİKESİ! TEZGAHA ÇIK! ⚠️', hz.x, GROUND_Y - 42, 16, '#ff4838');
    } else if (hz.type === 'hamsi_target') {
      if (hz.timer > 0) {
        const pulse = 0.25 + 0.18 * Math.sin(G.time * 14);
        ctx.fillStyle = `rgba(255, 55, 45, ${pulse})`;
        ctx.beginPath();
        ctx.ellipse(hz.x, GROUND_Y - 2, 58, 18, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ff3322';
        ctx.lineWidth = 3;
        ctx.stroke();

        const prog = Math.max(0, hz.timer / hz.maxTimer);
        const outerR = 58 + prog * 52;
        ctx.strokeStyle = '#ffcc00';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.ellipse(hz.x, GROUND_Y - 2, outerR, outerR * 0.31, 0, 0, Math.PI * 2);
        ctx.stroke();

        drawOutlined('⚠️ HAMSİ!', hz.x, GROUND_Y - 46, 14.5, '#ffe044');

        if (hz.timer < 0.45) {
          const dropY = GROUND_Y - (hz.timer / 0.45) * 620;
          drawImgCenter('proj_hamsi', hz.x, dropY, 68, Math.PI / 2, 1);
        }
      }
    } else if (hz.type === 'buffet_rush') {
      drawImgCenter('proj_zehirli_kokteyl', hz.x, GROUND_Y - 32, 66, G.time * (hz.vx > 0 ? 14 : -14), 1);
      drawOutlined('DÖNER SERVİSİ!', hz.x, GROUND_Y - 70, 14, '#ffdd55');
    } else if (hz.type === 'tea_spill') {
      const a = Math.min(1, hz.timer / 0.5);
      ctx.save(); ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(255, 165, 50, 0.28)';
      ctx.beginPath(); ctx.ellipse(hz.x, GROUND_Y - 2, hz.halfW, 13, 0, 0, Math.PI * 2); ctx.fill();
      drawImgBox('vfx_puddle_tea', hz.x - hz.halfW, GROUND_Y - 22, hz.halfW * 2, 34, a * 0.9);
      ctx.restore();
    } else if (hz.type === 'heat_pool') {
      const a = Math.min(1, hz.timer / 0.6);
      const pulse = 0.3 + 0.15 * Math.sin(G.time * 10 + hz.x);
      ctx.save(); ctx.globalAlpha = a;
      ctx.fillStyle = `rgba(110, 255, 85, ${pulse})`;
      ctx.beginPath(); ctx.ellipse(hz.x, GROUND_Y - 2, hz.halfW, 15, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(215, 255, 95, 0.78)'; ctx.lineWidth = 2; ctx.stroke();
      drawImgBox('vfx_splat_slime_green', hz.x - hz.halfW, GROUND_Y - 24, hz.halfW * 2, 36, a * 0.92);
      ctx.restore();
    } else if (hz.type === 'fire_zone') {
      const a = Math.min(1, hz.timer / 0.55);
      const flick = 1 + Math.sin(G.time * 18 + hz.x) * 0.1;
      ctx.save(); ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(255, 75, 25, 0.36)';
      ctx.beginPath(); ctx.ellipse(hz.x, GROUND_Y - 2, hz.halfW, 16, 0, 0, Math.PI * 2); ctx.fill();
      drawImgBox('vfx_fire_zone', hz.x - hz.halfW, GROUND_Y - 62 * flick, hz.halfW * 2, 68 * flick, a);
      drawOutlined('ALEV!', hz.x, GROUND_Y - 68, 12.5, '#ffbb55');
      ctx.restore();
    }
  }

  // Hero (7 animated sheets)
  let hSheet = 'hero_idle', hSlot = Math.floor(G.time * 8) % 12;
  if (G.nazarAnimT > 0) { hSheet = 'hero_nazar'; hSlot = Math.min(11, Math.floor((0.58 - G.nazarAnimT) / 0.58 * 12)); }
  else if (G.kolonyaVfxT > 0) { hSheet = 'hero_cologne'; hSlot = Math.min(11, Math.floor((0.36 - G.kolonyaVfxT) / 0.36 * 12)); }
  else if (G.hitAnimT > 0) { hSheet = 'hero_hit'; hSlot = Math.min(3, Math.floor((0.32 - G.hitAnimT) / 0.32 * 4)); }
  else if (G.throwAnimT > 0) { hSheet = 'hero_throw'; hSlot = Math.min(11, Math.floor((0.26 - G.throwAnimT) / 0.26 * 12)); }
  else if (!G.onGround) { hSheet = 'hero_jump'; hSlot = Math.min(11, Math.floor(Math.max(0, Math.min(1, (G.pvy + 690) / 1380)) * 11)); }
  else if (Math.abs(G.pvx) > 25) { hSheet = 'hero_run'; hSlot = Math.floor(G.walkT * (Math.abs(G.pvx) > 320 ? 16 : 12)) % 12; }

  const hOp = (G.invulnT > 0 && Math.floor(G.time * 22) % 2 === 0) ? 0.55 : 1;
  const shadowY = G.onPlatform ? ((G.platY || (GROUND_Y - PROP_TOP_H)) + 3) : (GROUND_Y + 4);
  const shSc = Math.max(0.45, 1 - Math.max(0, shadowY - G.py) / 360);
  ctx.fillStyle = 'rgba(12,10,22,0.55)';
  ctx.beginPath(); ctx.ellipse(G.px, shadowY, 44 * shSc, 12 * shSc, 0, 0, Math.PI * 2); ctx.fill();
  drawSheetFrame(hSheet, 4, hSlot, G.px, G.py, 222, G.facing, G.heroSX, G.heroSY, 0, hOp);

  if (G.kolonyaVfxT > 0) drawImgCenter('proj_kolonya_bulutu', G.px + G.facing * G.kolonyaRange * 0.52, G.py - 92, 138, G.facing < 0 ? Math.PI : 0, Math.min(1, G.kolonyaVfxT / 0.36 * 1.25));
  if (G.nazarCone) {
    const nc = G.nazarCone;
    const p = 1 - (nc.life / nc.maxLife);
    const ease = 1 - Math.pow(1 - Math.min(1, p * 1.5), 3);
    const curR = nc.range * ease;
    const baseAng = nc.dir > 0 ? 0 : Math.PI;
    const alpha = Math.min(1, nc.life / (nc.maxLife * 0.45));
    ctx.save();
    ctx.globalAlpha = alpha;
    const grad = ctx.createRadialGradient(nc.x, nc.y, 18, nc.x, nc.y, Math.max(24, curR));
    grad.addColorStop(0, 'rgba(130, 245, 255, 0.72)');
    grad.addColorStop(0.55, 'rgba(40, 175, 255, 0.40)');
    grad.addColorStop(1, 'rgba(15, 95, 255, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(nc.x, nc.y);
    ctx.arc(nc.x, nc.y, Math.max(24, curR), baseAng - 0.48, baseAng + 0.48);
    ctx.closePath();
    ctx.fill();
    for (let wi = 0; wi < 3; wi++) {
      const wr = curR * (0.45 + wi * 0.25);
      ctx.strokeStyle = `rgba(145, 245, 255, ${0.85 - wi * 0.22})`;
      ctx.lineWidth = 5 - wi;
      ctx.beginPath();
      ctx.arc(nc.x, nc.y, wr, baseAng - 0.44, baseAng + 0.44);
      ctx.stroke();
    }
    ctx.restore();
  }
  if (G.nazarAnimT > 0) drawImgCenter('proj_nazar_halka', G.px + G.facing * 95, G.py - 96, 165, G.time * 8, Math.min(1, G.nazarAnimT / 0.58 * 1.3));

  for (const pr of G.projectiles) drawImgCenter('proj_ayran_sise', pr.x, pr.y, 46, pr.rot, 1);
  for (const ep of G.enemyProjs) {
    if (ep.img && images[ep.img]) drawImgCenter(ep.img, ep.x, ep.y, 54, ep.rot, 1);
    drawOutlined(ep.label, ep.x, ep.y - 34, 12, '#fff08c');
  }

  for (const sw of G.waves) {
    ctx.strokeStyle = `rgba(${sw.r},${sw.g},${sw.b},${(sw.life / sw.maxLife) * 0.9})`;
    ctx.lineWidth = 9; ctx.beginPath();
    if (sw.groundOnly) ctx.ellipse(sw.x, sw.y, sw.rad, 22, 0, 0, Math.PI * 2);
    else ctx.arc(sw.x, sw.y, sw.rad, 0, Math.PI * 2);
    ctx.stroke();
  }
  for (const pt of G.particles) {
    ctx.fillStyle = `rgba(${pt.r},${pt.g},${pt.b},${pt.life / pt.maxLife})`;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.rad, 0, Math.PI * 2); ctx.fill();
  }
  for (const fl of G.floats) {
    const a = Math.min(1, (fl.life / fl.maxLife) * 1.6);
    if (fl.isBubble) drawSpeechBubble(fl.text, fl.x, fl.y, fl.size, a);
    else { ctx.save(); ctx.globalAlpha = a; drawOutlined(fl.text, fl.x, fl.y, fl.size, `rgb(${fl.r},${fl.g},${fl.b})`); ctx.restore(); }
  }

  // Atmospheric drifting time-of-day heat-motes (Noon sunlit gold / İkindi rose-gold / Akşam embers)
  if (G.snowFlakes) {
    ctx.fillStyle = G.levelIdx === 0 ? '#fff2bd' : (G.levelIdx === 1 ? '#ffc285' : '#ffe6a3');
    for (const f of G.snowFlakes) {
      const fdt = (G.screen === 'play') ? (G.dt || 0.016) : 0;
      f.x += f.vx * 0.45 * fdt;
      f.y -= f.vy * 0.35 * fdt;
      if (f.y < -10) { f.y = VH + 10; f.x = Math.random() * (WORLD_W + 400) - 200; }
      if (f.x < -200) { f.x = WORLD_W + 100; }
      const viewX = ((f.x - G.camX * f.depth) % (VW + 80) + (VW + 80)) % (VW + 80) - 40;
      ctx.save();
      ctx.globalAlpha = f.alpha * (G.levelIdx === 0 ? 0.45 : 0.55);
      ctx.beginPath();
      ctx.arc(G.camX + viewX, f.y, f.r * 0.9, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  ctx.restore();
}

function drawHUD() {
  const lvl = LEVELS[G.levelIdx];
  const hx = 14, hy = 8, hw = 286, hh = 98;
  drawImgBox('hud_health_bar', hx, hy, hw, hh);
  const hpFrac = Math.max(0, Math.min(1, G.hp / Math.max(1, G.maxHp)));
  const barL = hx + hw * 0.305, barW = hw * 0.648, barT = hy + hh * 0.34, barH = hh * 0.33;
  if (hpFrac < 0.99) fillRectR(barL + barW * hpFrac, barT, barW * (1 - hpFrac), barH, 3, 'rgba(38,32,46,0.96)');
  if (hpFrac <= 0.35 && hpFrac > 0.01) fillRectR(barL, barT, barW * hpFrac, barH, 3, 'rgba(245,62,72,0.78)');
  drawOutlined(`SAĞLIK ${Math.ceil(G.hp)}/${G.maxHp}`, barL + barW * 0.5, hy + hh * 0.51, 14.5, '#ffffff');

  drawImgBox('hud_ayran_counter', 16, 102, 166, 66);
  drawOutlined(`${G.ayran}/${G.maxAyran}`, 107, 138, 17.5, '#91eeff');
  addZone('btn_shop', 142, 114, 38, 44);

  drawImgBox('hud_gold_counter', 186, 106, 168, 60);
  drawOutlined(`${G.gold} ₺`, 274, 137, 17.5, '#ffe85f');
  addZone('btn_shop', 316, 114, 38, 44);

  const lw = VW < 1380 ? 388 : 432, lh = 128, lx = (VW - lw) / 2, ly = 2;

  const prog = Math.min(1, G.calmedInLevel / Math.max(1, lvl.goal));

  if (prog > 0.01) {
    fillRectR(pbL, pbT, pbW * prog, pbH, 5, '#5ff273');
    fillRectR(pbL + 2, pbT + 2, Math.max(4, pbW * prog - 4), 5, 2, 'rgba(255,255,255,0.5)');
  }
  drawOutlined(lvl.title, lx + lw * 0.56, 114, 13.5, '#ffec82');

  for (const z of G.zombies) {
    if (z.isBoss && !z.calmed) {
      const bBarW = 500, bBarX = (VW - bBarW) / 2;
      fillRectR(bBarX, 140, bBarW, 38, 11, 'rgba(115,22,34,0.96)');
      strokeRectR(bBarX, 140, bBarW, 38, 11, '#ffcd50', 3);
      fillRectR(bBarX + 14, 159, bBarW - 28, 12, 6, '#1c0c12');
      fillRectR(bBarX + 16, 161, (bBarW - 32) * Math.max(0, z.hp / z.maxHp), 8, 4, '#ff4c44');
      drawOutlined(z.label, VW / 2, 150, 13, '#ffec7d');
    }
  }

  // Sound Toggle, Score Panel & Pause Button in HUD (respects #fsBtn offset on mobile!)
  const fsOff = getFsRightOffset();
  const pauseX = VW - 44 - fsOff;
  drawImgCenter('ui_btn_settings', pauseX, 54, G.hover === 'btn_pause' ? 64 : 58);
  addZone('btn_pause', pauseX - 32, 22, 64, 64);

  const scrW = VW < 1380 ? 168 : 196, scrX = pauseX - 38 - scrW;
  drawImgBox('hud_score_panel', scrX, 12, scrW, 82);
  drawOutlined(String(G.score), scrX + scrW * 0.62, 57, 21, '#ffee7d');

  const sndHov = G.hover === 'btn_sound';
  const sndW = 58, sndX = scrX - 66;

  strokeRectR(sndX, 26, sndW, 52, 13, G.muted ? '#ff6666' : '#5affc3', 2.5);
  drawLabel(G.muted ? '🔇' : '🔊', sndX + sndW / 2, 54, 22, '#ffffff', 'center', false);
  addZone('btn_sound', sndX, 26, sndW, 52);

  if (G.combo >= 2) {
    const cmbX = pauseX - 158;
    drawImgBox('ui_badge_red', cmbX, 96, 194, 54);
    drawOutlined(`${G.combo}x KOMBO!`, cmbX + 97, 121, 18, '#fff073');
  }
  if (G.bossBannerT > 0) {
    drawImgBox('ui_badge_red', (VW - 740) / 2, 152, 740, 112);
    drawOutlined(`DİKKAT! ${lvl.boss.name} GELİYOR!`, VW / 2, 206, 22, '#ffee6e');
  }

  // ============================================================================
  // MOBILE GHOST ARCADE HUD (Zero-clutter, translucent, ergonomic thumb-arc)
  // ============================================================================

  // --- LEFT SIDE: COMPACT TRANSLUCENT D-PAD CAPSULE ---
  const lPressed = G.holdLeft || G.hover === 'pad_left';
  const rPressed = G.holdRight || G.hover === 'pad_right';

  // Single sleek glass pill background (higher contrast & crisp centered arrows)
  fillRectR(32, 608, 172, 78, 39, 'rgba(12, 22, 46, 0.50)');
  strokeRectR(32, 608, 172, 78, 39, 'rgba(120, 230, 255, 0.58)', 2.2);

  // Left Arrow Button (pad_left)
  if (lPressed) {

  }
  drawOutlined('◀', 74, 647, 32, lPressed ? '#ffffff' : '#d2f4ff');
  addZone('pad_left', 26, 600, 88, 94);

  // Divider line
  ctx.strokeStyle = 'rgba(110, 220, 255, 0.30)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(118, 616); ctx.lineTo(118, 678); ctx.stroke();

  // Right Arrow Button (pad_right)
  if (rPressed) {
    ctx.fillStyle = 'rgba(78, 230, 255, 0.28)';
    ctx.beginPath(); ctx.arc(162, 647, 32, 0, Math.PI * 2); ctx.fill();
  }
  drawOutlined('▶', 162, 647, 32, rPressed ? '#ffffff' : '#d2f4ff');
  addZone('pad_right', 118, 600, 88, 94);

  // Drop Down Button (pad_down) - Only appears contextually when standing on a platform!
  if (G.onPlatform) {
    const dPressed = G.hover === 'pad_down';
    ctx.save();
    ctx.shadowColor = '#ffb454';
    ctx.shadowBlur = dPressed ? 14 : 6;
    ctx.fillStyle = dPressed ? '#8c4e24' : 'rgba(28, 20, 18, 0.65)';
    ctx.beginPath(); ctx.arc(118, 560, 26, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ffb454'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
    drawOutlined('▼', 118, 560, 20, '#fff4cb');
    addZone('pad_down', 92, 534, 52, 52);
  }

  // --- CENTER KEYBOARD BANNER: Only shown on desktop/keyboard, hidden on mobile touch devices ---
  if (!IS_TOUCH) {
    const kBarW = 460, kBarX = (VW - kBarW) / 2;
    fillRectR(kBarX, 678, kBarW, 26, 8, 'rgba(12, 14, 26, 0.45)');
    strokeRectR(kBarX, 678, kBarW, 26, 8, 'rgba(80, 110, 160, 0.35)', 1);
    drawLabel('Space: Zıpla • J: Ayran • K: Kolonya • Q: Nazar • S: İn', VW / 2, 692, 11, '#dce8ff', 'center', false);
  }

  // --- RIGHT SIDE: ERGONOMIC THUMB-ARC CLUSTER (Zero solid background box) ---
  // Dynamically anchored to VW right edge:
  const ayX = VW - 96, ayY = 632;
  const jpX = VW - 206, jpY = 634;
  const klX = VW - 188, klY = 520;
  const nzX = VW - 85, nzY = 514;

  // 1. MEGA NAZAR (Top-Right Arc, compact floating circle)
  const nReady = G.nazar >= 100;
  const nPulse = nReady ? (1 + Math.sin(G.time * 8) * 0.08) : 1;
  drawImgCenter('ui_btn_nazar', nzX, nzY, 66 * nPulse, 0, nReady ? 1 : 0.52);
  drawOutlined(nReady ? 'NAZAR!' : `${Math.floor(G.nazar)}%`, nzX, nzY + 40, 12, nReady ? '#6effff' : '#9be2f5');
  addZone('btn_nazar', nzX - 33, nzY - 33, 66, 66);

  // 2. KOLONYA ŞOKU (Top-Center Arc, compact floating circle)
  const kReady = G.kolonyaCd <= 0;
  drawImgCenter('ui_btn_kolonya', klX, klY, 66, 0, kReady ? 1 : 0.48);
  drawOutlined(kReady ? 'ŞOK!' : `${G.kolonyaCd.toFixed(1)}s`, klX, klY + 38, 12, kReady ? '#8cff9a' : '#85a88c');
  addZone('btn_kolonya', klX - 33, klY - 33, 66, 66);

  // 3. ZIPLA / JUMP (Left thumb-arc, naturally swept from Ayran)
  const jPressed = G.hover === 'pad_jump';
  const hasDbl = (G.upLevels.belt_cap || 0) >= 1;
  const isDblReady = !G.onGround && hasDbl && G.jumpsLeft > 0;

  ctx.shadowColor = isDblReady ? '#ff9a2e' : (jPressed ? '#6ee0ff' : 'rgba(0,0,0,0)');
  ctx.shadowBlur = jPressed ? 14 : 6;
  ctx.fillStyle = isDblReady ? 'rgba(255, 140, 40, 0.42)' : (jPressed ? 'rgba(45, 120, 180, 0.45)' : 'rgba(16, 28, 54, 0.38)');
  ctx.beginPath(); ctx.arc(jpX, jpY, 38, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = isDblReady ? '#ffbe52' : (jPressed ? '#6ee0ff' : 'rgba(110, 210, 255, 0.45)');
  ctx.lineWidth = 2.2; ctx.stroke();
  ctx.restore();

  drawOutlined(isDblReady ? '▲▲' : '▲', jpX, jpY - 5, isDblReady ? 22 : 24, isDblReady ? '#ffe27d' : '#ffffff');
  drawLabel(isDblReady ? '2X' : 'ZIPLA', jpX, jpY + 20, 10.5, isDblReady ? '#ffe27d' : '#cce8ff', 'center', true);
  addZone('pad_jump', jpX - 40, jpY - 40, 80, 80);

  // 4. AYRAN AT (Primary Action - Floating corner circle)
  const aPressed = G.hover === 'btn_ayran';
  ctx.save();
  ctx.shadowColor = aPressed ? '#ffe05c' : 'rgba(255, 200, 40, 0.4)';
  ctx.shadowBlur = aPressed ? 18 : 8;
  drawImgCenter('ui_btn_ayran', ayX, ayY, aPressed ? 92 : 100, 0, 1);
  ctx.restore();
  drawOutlined('AYRAN', ayX, ayY + 44, 13.5, '#ffea62');
  addZone('btn_ayran', ayX - 50, ayY - 50, 100, 100);
}

function drawKeycapBar(cy) {
  const barW = 750, bx = (VW - barW) / 2;
  fillRectR(bx, cy - 19, barW, 38, 12, 'rgba(18,16,34,0.86)');
  strokeRectR(bx, cy - 19, barW, 38, 12, 'rgba(95,112,160,0.75)', 2);
  const items = [['A',''],['D','Yürü'],['Shift','Koş'],['Space','Zıpla'],['S','Tezgahtan İn'],['M','Market'],['U','Ses']];
  let x = bx + 18, ky = cy - 12;
  for (const [k, d] of items) {
    const kw = Math.max(26, k.length * 9.5 + 14);
    fillRectR(x, ky + 2, kw, 24, 6, '#12101e');
    fillRectR(x, ky, kw, 23, 6, '#f8f8ff');
    strokeRectR(x, ky, kw, 23, 6, '#1c182a', 2);
    drawLabel(k, x + kw / 2, ky + 12, 12.5, '#1a1626', 'center', true);
    x += kw + 7;

function wrapTextLines(str, maxW, fontSpec) {
  ctx.save();
  ctx.font = fontSpec;
  const words = (str || '').split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    const cand = cur ? (cur + ' ' + w) : w;
    if (cur && ctx.measureText(cand).width > maxW) {
      lines.push(cur);
      cur = w;
    } else {
      cur = cand;
    }
  }
  if (cur) lines.push(cur);
  ctx.restore();
  return lines;
}

function drawStoryPortrait(speakerId, x, y, isActive, isTyping, isRinging) {
  const sp = window.STORY_DATA && window.STORY_DATA.speakers[speakerId];
  if (!sp || !sp.portrait) return;
  const p = sp.portrait;
  const pop = isActive ? (1.0 + Math.max(0, 1 - G.story.nodeT * 6) * 0.08) : 0.93;
  const talkBob = (isActive && isTyping) ? Math.abs(Math.sin(G.time * 18)) * 5 : 0;
  const alpha = isActive ? 1.0 : 0.56;

  ctx.save();
  if (isActive) {
    const grad = ctx.createRadialGradient(x, y - 160, 20, x, y - 160, 185);
    grad.addColorStop(0, 'rgba(255, 226, 128, 0.34)');
    grad.addColorStop(1, 'rgba(255, 226, 128, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(x, y - 160, 185, 0, Math.PI * 2); ctx.fill();
  }

  if (p.kind === 'phone') {
    const vibX = (isRinging && G.story.nodeT < 1.2) ? Math.sin(G.time * 58) * 5 : 0;

    const px = x + vibX, py = y - 224 - talkBob;
    ctx.save();

    ctx.translate(px, py);
    ctx.rotate(vibR);
    ctx.scale(pop, pop);
    // Sound wave arcs when ringing
    if (isRinging) {
      const pulse = (G.time * 2.2) % 1;
      ctx.strokeStyle = `rgba(126, 240, 255, ${(1 - pulse) * 0.85})`;
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(0, 0, 106 + pulse * 44, -0.7, 0.7); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 106 + pulse * 44, Math.PI - 0.7, Math.PI + 0.7); ctx.stroke();

function drawCityHeatMotionOverlay(t) {
  // 1. Subtle midday solar glare & rising warm golden-amber heat-shimmer bands
  const sunGlow = ctx.createRadialGradient(VW * 0.78, 65, 20, VW * 0.78, 65, 420);
  sunGlow.addColorStop(0, 'rgba(255, 245, 190, 0.22)');
  sunGlow.addColorStop(1, 'rgba(255, 212, 96, 0)');
  ctx.fillStyle = sunGlow;
  ctx.fillRect(0, 0, VW, 460);

  const mistPulse = 0.16 + 0.09 * Math.sin(t * 2.4);
  const mistGrad = ctx.createLinearGradient(0, 320, 0, 540);
  mistGrad.addColorStop(0, 'rgba(255, 212, 96, 0)');
  mistGrad.addColorStop(0.6, `rgba(255, 212, 96, ${mistPulse})`);
  mistGrad.addColorStop(1, 'rgba(255, 168, 68, 0)');
  ctx.fillStyle = mistGrad;
  ctx.fillRect(0, 320, VW, 220);

  // 2. Animated comic smoke puffs rising from the sparking Fethiye rooftop AC units
  const acSpots = [{ x: 195, y: 455 }, { x: 280, y: 435 }];
  for (let i = 0; i < 10; i++) {
    const src = acSpots[i % 2];
    const phase = ((t * 0.42 + i * 0.19) % 1);
    const sx = src.x + Math.sin(phase * 5 + i) * 22 + phase * 32;
    const sy = src.y - phase * 170;
    const sr = 9 + phase * 24;
    ctx.save();
    ctx.globalAlpha = (1 - phase) * 0.34;
    ctx.fillStyle = i % 3 === 0 ? '#ff9d42' : '#4a3d4f';
    ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // 3. Animated Vidico-style Thermometer Card (left-mid, climbs 36°C -> 45°C!)
  const enter = Math.min(1, t / 0.42);
  const ease = 1 - Math.pow(1 - enter, 3);
  const tx = 44 - (1 - ease) * 90;
  const ty = 132;
  const deg = 36 + Math.min(1, Math.max(0, (t - 0.25) / 1.45)) * 9;
  const isHot = deg >= 44.5;
  const shakeX = isHot ? Math.sin(t * 44) * 2.2 : 0;

  ctx.save();
  ctx.translate(tx + shakeX, ty);
  fillRectR(0, 4, 214, 152, 16, 'rgba(10, 6, 18, 0.78)');
  fillRectR(0, 0, 214, 152, 16, 'rgba(26, 16, 36, 0.92)');
  strokeRectR(0, 0, 214, 152, 16, isHot ? '#ff5c4d' : '#ffd86b', 3);
  // Glass thermometer tube
  fillRectR(26, 22, 18, 86, 9, '#120d1d');
  strokeRectR(26, 22, 18, 86, 9, '#8aa0c8', 2);
  const fillFrac = (deg - 34) / 13;
  const fh = Math.max(12, 80 * Math.min(1, fillFrac));
  fillRectR(29, 25 + (80 - fh), 12, fh, 6, isHot ? '#ff4033' : '#ff9a3c');
  ctx.fillStyle = isHot ? '#ff4033' : '#ff9a3c';
  ctx.beginPath(); ctx.arc(35, 118, 15, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#18121e'; ctx.lineWidth = 3; ctx.stroke();
  // Live rising temperature readout
  drawOutlined(`${Math.round(deg)}°C`, 128, 52, 40, isHot ? '#ff6454' : '#ffdf6b');
  fillRectR(64, 88, 134, 26, 8, isHot ? 'rgba(220, 42, 42, 0.92)' : 'rgba(160, 96, 24, 0.9)');
  drawLabel(isHot ? 'HARARET KRİTİK!' : 'KLİMALAR ÇÖKTÜ', 131, 102, 12, '#ffffff', 'center', true);
  drawLabel('FETHİYE • 13:30 ÖĞLEN', 131, 132, 11, '#ffe5a3', 'center', false);
  ctx.restore();

  // 4. Animated Er-Öz Hotel Target Callout pointing cleanly at the Fethiye hotel sign
  const hx = 990, hy = 278;
  const ringP = (t * 0.9) % 1;
  ctx.save();
  ctx.strokeStyle = `rgba(255, 226, 110, ${(1 - ringP) * 0.85})`;
  ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.arc(hx, hy, 22 + ringP * 32, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#7ef0ff';
  ctx.beginPath(); ctx.arc(hx, hy, 6, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(126, 240, 255, 0.88)';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(hx - 14, hy - 14); ctx.lineTo(hx - 78, hy - 68); ctx.stroke();
  fillRectR(hx - 302, hy - 102, 228, 52, 12, 'rgba(16, 36, 56, 0.92)');
  strokeRectR(hx - 302, hy - 102, 228, 52, 12, '#7ef0ff', 2.5);
  drawOutlined('ER-ÖZ HOTEL ★★★★★', hx - 188, hy - 84, 13.5, '#ffec7d');
  drawLabel('SON KLİMALI GÜVENLİ BÖLGE', hx - 188, hy - 64, 11, '#b8f4ff', 'center', true);
  ctx.restore();
}

function drawStoryScreen() {
  const sc = window.STORY_DATA && window.STORY_DATA.scenes[G.story.sceneId];
  const node = getStoryNode();
  if (!sc || !node) { finishStoryScene(); return; }

  // 1. Scene or per-node background with optional Ken Burns / Suit-Up motion!
  const bgId = node.bg || sc.bg;
  const bgImg = images[bgId] || images.ui_title_bg;
  const nt = G.story.nodeT || 0;
  const isIllustratedScene = (bgId === 'bg_intro_city_heat' || bgId === 'bg_fethiye_chaos' || bgId === 'bg_hotel_siege' || bgId === 'bg_balcony_chill' || bgId === 'bg_balcony_chill_day' || bgId === 'bg_balcony_phone' || bgId === 'bg_balcony_phone_day' || bgId === 'bg_suitup_comic' || bgId === 'bg_intro_cooler' || bgId === 'bg_intro_cooler_day');

  if (bgImg && bgImg.complete && bgImg.naturalWidth > 0) {
    if (bgImg.naturalWidth > 2000) {
      const cropX = bgId === 'bg_l3_classic' ? 2420 : (bgId === 'bg_l2_classic' ? 1120 : 620);
      const srcW = Math.min(bgImg.naturalWidth - cropX, Math.round(bgImg.naturalHeight * (VW / VH)));
      ctx.drawImage(bgImg, cropX, 0, srcW, bgImg.naturalHeight, 0, 0, VW, VH);
    } else {
      ctx.save();
      let scK = 1.0, ox = 0, oy = 0;
      if (node.motion === 'city_heat') {
        const p = Math.min(1, nt / 9.0);
        scK = 1.02 + p * 0.06;
        ox = -p * 26;
        oy = -p * 8;
      } else if (node.motion === 'balcony_breathe') {
        scK = 1.01 + Math.sin(G.time * 0.7) * 0.008;
      } else if (node.motion === 'suitup_flash') {
        const pop = Math.max(0, 1 - nt * 4.5);
        scK = 1.02 + pop * 0.12;
      }
      ctx.translate(VW / 2 + ox, VH / 2 + oy);
      ctx.scale(scK, scK);
      ctx.drawImage(bgImg, -VW / 2, -VH / 2, VW, VH);
      ctx.restore();
    }
  } else {
    fillRectR(0, 0, VW, VH, 0, '#141024');
  }

  // 1b. Motion Graphic Overlays (City Heat Intro / Suit-Up Comic Flash)
  if (node.motion === 'city_heat') {
    drawCityHeatMotionOverlay(nt);
  } else if (node.motion === 'suitup_flash' && nt < 0.35) {
    ctx.fillStyle = `rgba(180, 248, 255, ${(1 - nt / 0.35) * 0.72})`;
    ctx.fillRect(0, 0, VW, VH);
  }

  // 2. Atmospheric scrim (lighter on custom illustrated scenes so art shines!)
  const scrim = ctx.createLinearGradient(0, 0, 0, VH);
  scrim.addColorStop(0, isIllustratedScene ? 'rgba(14, 10, 26, 0.24)' : 'rgba(14, 10, 26, 0.56)');
  scrim.addColorStop(0.55, isIllustratedScene ? 'rgba(18, 12, 30, 0.14)' : 'rgba(18, 12, 30, 0.48)');
  scrim.addColorStop(1, isIllustratedScene ? 'rgba(10, 7, 20, 0.76)' : 'rgba(10, 7, 20, 0.84)');
  ctx.fillStyle = scrim;
  ctx.fillRect(0, 0, VW, VH);

  // 3. Top Header: Chapter Tag (left) + Fixed Log & Skip Controls (right)
  fillRectR(26, 20, 440, 62, 14, 'rgba(58, 34, 20, 0.94)');
  strokeRectR(26, 20, 440, 62, 14, '#ffd86b', 3);
  drawOutlined(sc.chapterTag || '', 44, 42, 18.5, '#ffec7d', 'left');
  drawLabel(sc.subtitle || '', 44, 65, 13.5, '#f2e6cf', 'left', false);

  // Backlog & Skip buttons (fixed corner, shifts cleanly left of #fsBtn on mobile!)
  const skipHov = G.hover === 'btn_story_skip';
  const skipX = VW - 176 - getFsRightOffset();
  const logHov = G.hover === 'btn_story_log';
  const logX = skipX - 148;
  fillRectR(logX, 24, 134, 48, 12, logHov ? '#3c5478' : 'rgba(26, 36, 56, 0.92)');
  strokeRectR(logX, 24, 134, 48, 12, '#8cdfff', 2.5);
  drawOutlined(IS_TOUCH ? 'GEÇMİŞ' : 'GEÇMİŞ [L]', logX + 67, 48, 14.5, '#e8f9ff');
  addZone('btn_story_log', logX, 24, 134, 48);

  fillRectR(skipX, 24, 148, 48, 12, skipHov ? '#e69f24' : '#b8721a');
  strokeRectR(skipX, 24, 148, 48, 12, '#18121e', 3);
  drawOutlined(IS_TOUCH ? 'ATLA ⏭' : 'ATLA [ESC] ⏭', skipX + 74, 48, 14.5, '#fff8dc');
  addZone('btn_story_skip', skipX, 24, 148, 48);

  // 4. Optional Spotlight Plaque (e.g., "45°C YAZ GECESİ", "SOĞUK, PAYLAŞINCA SOĞUK.")
  if (node.plaque) {
    const pScale = 1 + Math.max(0, 1 - G.story.nodeT * 5) * 0.08;
    ctx.save();
    ctx.translate(VW / 2, 128);
    ctx.scale(pScale, pScale);
    const pw = Math.max(320, node.plaque.length * 16 + 70);
    fillRectR(-pw / 2, -26, pw, 52, 14, 'rgba(130, 26, 38, 0.95)');
    strokeRectR(-pw / 2, -26, pw, 52, 14, '#ffd966', 3.5);
    drawOutlined(node.plaque, 0, 1, 21, '#fff3a1');
    ctx.restore();
  }

  // 5. Left & Right Character Portraits (tucked cleanly behind sleek lower-third dialogue bar)
  const bw = Math.min(1008, VW - 120), bx = (VW - bw) / 2, by = 568, bh = 128;
  const fullText = node.text || '';
  const isTyping = G.story.charIdx < fullText.length;
  if (node.left) {
    drawStoryPortrait(node.left, bx + 104, 584, node.side === 'left', isTyping, false);
  }
  if (node.right) {
    drawStoryPortrait(node.right, bx + bw - 104, 584, node.side === 'right', isTyping, !!node.phoneRing);
  }

  // 6. Choice Buttons (clean center stack between portraits, zero overlap!)
  const hasChoices = !!(node.choices && node.choices.length > 0 && !isTyping && !G.story.logOpen);
  if (hasChoices) {
    const cw = 520, ch = 58, gap = 14;
    const cx = (VW - cw) / 2;
    const startY = 396;
    node.choices.forEach((chObj, ci) => {
      const cy = startY + ci * (ch + gap);
      const zid = 'story_choice_' + ci;
      const hov = G.hover === zid;
      fillRectR(cx, cy + 4, cw, ch, 14, 'rgba(12, 8, 22, 0.88)');
      fillRectR(cx, cy, cw, ch, 14, hov ? '#1c5e85' : '#143c59');
      strokeRectR(cx, cy, cw, ch, 14, hov ? '#ffec7d' : '#6be3ff', 3);
      // Number keycap badge
      fillRectR(cx + 14, cy + 14, 30, 30, 8, '#ffec7d');
      drawLabel(String(ci + 1), cx + 29, cy + 30, 16, '#18121e', 'center', true);
      drawOutlined(chObj.text, cx + 56, cy + 30, 17.5, '#ffffff', 'left');
      addZone(zid, cx, cy, cw, ch);
    });
  }

  // 7. Bottom Comic Dialogue Box (sleek, compact lower-third so scene art shines!)
  fillRectR(bx, by + 5, bw, bh, 16, 'rgba(8, 6, 16, 0.86)');
  fillRectR(bx, by, bw, bh, 16, '#6e3e20');
  strokeRectR(bx, by, bw, bh, 16, '#16111e', 4);
  fillRectR(bx + 8, by + 8, bw - 16, bh - 16, 12, 'rgba(22, 16, 32, 0.94)');
  strokeRectR(bx + 8, by + 8, bw - 16, bh - 16, 12, 'rgba(255, 216, 107, 0.72)', 2);

  // Speaker Name Pill (compact, sits cleanly at top edge of dialogue bar)
  const sp = (window.STORY_DATA && window.STORY_DATA.speakers[node.speaker]) || { name: '', color: '#ffec82', bg: '#2c203c' };
  if (sp.name) {
    ctx.save();
    ctx.font = '800 16.5px BalooBold, sans-serif';
    const nw = Math.max(170, ctx.measureText(sp.name).width + 40);
    ctx.restore();
    const nx = node.side === 'right' ? (bx + bw - nw - 22) : (bx + 22);
    const ny = by - 20;
    fillRectR(nx, ny, nw, 36, 10, sp.bg || '#243a54');
    strokeRectR(nx, ny, nw, 36, 10, '#16111e', 3);
    drawOutlined(sp.name, nx + nw / 2, ny + 19, 16, sp.color || '#ffffff');
  }

  // Pre-wrapped typewriter text (zero mid-typing line jumps!)
  const fontSpec = '700 20px BalooMed, sans-serif';
  const lines = wrapTextLines(fullText, bw - 72, fontSpec);
  let remaining = G.story.charIdx;
  lines.slice(0, 3).forEach((ln, li) => {
    const shown = ln.slice(0, Math.max(0, remaining));
    remaining -= (ln.length + 1);
    if (shown) {
      drawLabel(shown, bx + 34, by + 40 + li * 27, 20, '#fffaf0', 'left', false);
    }
  });

  // Bottom-right Continue indicator
  if (!hasChoices) {
    const blinkY = isTyping ? 0 : Math.sin(G.time * 7) * 2.5;
    const hint = IS_TOUCH
      ? (isTyping ? 'TAMAMLA...' : 'DEVAM ▼')
      : (isTyping ? 'TAMAMLA [SPACE]' : 'DEVAM [SPACE] ▼');
    drawOutlined(hint, bx + bw - 26, by + bh - 20 + blinkY, 13.5, isTyping ? '#b8d8ff' : '#ffec7d', 'right');
  } else {
    drawLabel(IS_TOUCH ? 'Bir cevap seç (dokun)' : 'Bir cevap seç ([1] / [2] veya tıkla)', bx + bw - 26, by + bh - 20, 13, '#9eeeff', 'right', false);
  }

  // Click anywhere on box to advance (when log closed and no choices)
  if (!G.story.logOpen && !hasChoices) {
    addZone('btn_story_next', bx, by, bw, bh);
  }

  // 8. Backlog Overlay (optional)
  if (G.story.logOpen) {
    G.zones = [];
    fillRectR(0, 0, VW, VH, 0, 'rgba(10, 8, 20, 0.78)');
    const bModalW = 952, bmx = (VW - bModalW) / 2;
    drawWoodenModal(bmx, 54, bModalW, 608);
    drawImgBox('ui_badge_red', (VW - 416) / 2, 42, 416, 88);
    drawOutlined('KONUŞMA GEÇMİŞİ', VW / 2, 86, 23, '#ffec7d');
    const recent = G.story.backlog.slice(-6);
    if (recent.length === 0) {
      drawLabel('Henüz konuşma yok.', VW / 2, 320, 20, '#f0e6d2', 'center', false);
    } else {
      recent.forEach((entry, idx) => {
        const ey = 152 + idx * 68;
        const ex = bmx + 62;
        fillRectR(ex, ey, 828, 58, 10, 'rgba(34, 22, 38, 0.94)');
        strokeRectR(ex, ey, 828, 58, 10, 'rgba(255, 216, 107, 0.38)', 1.5);
        drawOutlined(entry.speaker + ':', ex + 18, ey + 29, 13.5, entry.color || '#ffec7d', 'left');
        const wrapped = wrapTextLines(entry.text, 584, '700 14px BalooMed, sans-serif');
        if (wrapped.length <= 1) {
          drawLabel(wrapped[0] || '', ex + 226, ey + 29, 14, '#fff9ee', 'left', false);
        } else {
          drawLabel(wrapped[0], ex + 226, ey + 19, 13.5, '#fff9ee', 'left', false);
          drawLabel(wrapped.slice(1).join(' '), ex + 226, ey + 39, 13.5, '#fff9ee', 'left', false);
        }
      });
    }
    drawGoldBtn('btn_story_log_close', VW / 2, 610, 260, 84, 'KAPAT', 22, false);
  }
}
