function getVirtualPos(ev) {
  const rect = canvas.getBoundingClientRect();
  if (isRotated) {
    return {
      x: ((ev.clientY - rect.top) / rect.height) * VW,
      y: ((rect.right - ev.clientX) / rect.width) * VH,
    };
  }
  return { x: (ev.clientX - rect.left) / rect.width * VW, y: (ev.clientY - rect.top) / rect.height * VH };
}
function hitTest(vx, vy) {
  for (let i = G.zones.length - 1; i >= 0; i--) {
    const z = G.zones[i];
    if (vx >= z.x && vx <= z.x + z.w && vy >= z.y && vy <= z.y + z.h) return z.id;
  }
  return '';
}

const activeMovePointers = new Map();
function syncMoveHolds() {
  let l = false, r = false;
  for (const dir of activeMovePointers.values()) {
    if (dir === 'left') l = true;
    if (dir === 'right') r = true;
  }
  G.holdLeft = l;
  G.holdRight = r;
}

canvas.addEventListener('pointermove', ev => {
  const p = getVirtualPos(ev);
  G.hover = hitTest(p.x, p.y);
  if (activeMovePointers.has(ev.pointerId)) {
    const id = hitTest(p.x, p.y);
    if (id === 'pad_left') { activeMovePointers.set(ev.pointerId, 'left'); syncMoveHolds(); }
    else if (id === 'pad_right') { activeMovePointers.set(ev.pointerId, 'right'); syncMoveHolds(); }
    else if (id === 'pad_down') {
      if (G.onPlatform) { G.dropThroughT = 0.28; G.onGround = false; G.onPlatform = false; G.pvy = 120; }
    }
  }
});
function releasePointer(ev) {
  if (activeMovePointers.has(ev.pointerId)) {
    activeMovePointers.delete(ev.pointerId);
    syncMoveHolds();
  }
}
canvas.addEventListener('pointerup', releasePointer);
canvas.addEventListener('pointercancel', releasePointer);
canvas.addEventListener('contextmenu', ev => { ev.preventDefault(); if (G.screen === 'play') useKolonya(); });
canvas.addEventListener('pointerdown', ev => {
  const ac = getAudioCtx();
  if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
  if (ev.button === 2) { if (G.screen === 'play') useKolonya(); return; }
  const p = getVirtualPos(ev);
  const id = hitTest(p.x, p.y);
  if (id === 'btn_sound') { toggleSound(); return; }
  if (id === 'btn_start') {
    if (IS_TOUCH) requestMobileFullscreen();
    resetFullGame();
    playSfx('sfx_coin');
    startStoryScene('l1_intro', () => { G.screen = 'play'; playSfx('sfx_win'); });
    return;
  }
  if (G.screen === 'story') {
    if (G.story.logOpen) {
      if (id === 'btn_story_log_close') { G.story.logOpen = false; }
      return;
    }
    if (id === 'btn_story_next') { advanceStory(); return; }
    if (id === 'btn_story_skip') { skipStoryScene(); return; }
    if (id === 'btn_story_log') { G.story.logOpen = true; return; }
    if (id.startsWith('story_choice_')) { chooseStoryOption(parseInt(id.slice(13), 10)); return; }
    return;
  }
  if (id === 'btn_go_play' && G.screen === 'intro') { G.screen = 'play'; playSfx('sfx_win'); return; }
  if (id === 'btn_shop') { if (G.screen === 'shop') G.screen = 'play'; else if (G.screen === 'play') tryOpenShop(); return; }
  if (id === 'btn_shop_next' && G.screen === 'shop') {
    if (G.bossDefeated) {
      setupLevel(G.levelIdx + 1);
      const nextScene = G.levelIdx === 1 ? 'l2_intro' : 'l3_intro';
      startStoryScene(nextScene, () => { G.screen = 'play'; playSfx('sfx_win'); });
    } else G.screen = 'play';
    return;
  }
  if (id === 'btn_pause' && G.screen === 'play') { G.screen = 'pause'; return; }
  if (id === 'btn_resume' && G.screen === 'pause') { G.screen = 'play'; return; }
  if (id === 'btn_restart') {
    if (G.screen === 'gameover') {
      G.hp = G.maxHp; G.ayran = G.maxAyran;
      setupLevel(G.levelIdx); G.screen = 'play'; return;
    }
    resetFullGame(); G.screen = 'title'; return;
  }
  if (id.startsWith('buy_') && G.screen === 'shop') { buyUpgrade(id.slice(4)); return; }
  if (G.screen !== 'play') return;
  if (id === 'pad_left') {
    activeMovePointers.set(ev.pointerId, 'left');
    syncMoveHolds();
    if (navigator.vibrate) try { navigator.vibrate(8); } catch (_) {}
    return;
  }
  if (id === 'pad_right') {
    activeMovePointers.set(ev.pointerId, 'right');
    syncMoveHolds();
    if (navigator.vibrate) try { navigator.vibrate(8); } catch (_) {}
    return;
  }
  if (id === 'pad_down') {
    if (G.onPlatform) {
      G.dropThroughT = 0.28; G.onGround = false; G.onPlatform = false; G.pvy = 120; playSfx('sfx_jump');
      if (navigator.vibrate) try { navigator.vibrate(10); } catch (_) {}
    }
    return;
  }
  if (id === 'pad_jump') {
    G.jumpBufT = 0.14; executeJump();
    if (navigator.vibrate) try { navigator.vibrate(10); } catch (_) {}
    return;
  }
  if (id === 'btn_ayran') {
    fireAyran(null);
    if (navigator.vibrate) try { navigator.vibrate(12); } catch (_) {}
    return;
  }
  if (id === 'btn_kolonya') {
    useKolonya();
    if (navigator.vibrate) try { navigator.vibrate(16); } catch (_) {}
    return;
  }
  if (id === 'btn_nazar') {
    useMegaNazar();
    if (navigator.vibrate) try { navigator.vibrate(25); } catch (_) {}
    return;
  }
  if (G.screen === 'play') {
    const inTopHud = p.y < 145;
    const inLeftPadZone = p.x < 230 && p.y > 530;
    const inRightArcZone = p.x > VW - 265 && p.y > 460;
    if (!inTopHud && !inLeftPadZone && !inRightArcZone) {
      fireAyran((p.x + G.camX) >= G.px ? 1 : -1);
    }
  }
});

window.addEventListener('keydown', ev => {
  const ac = getAudioCtx();
  if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
  if (ev.code === 'KeyU' || ev.code === 'KeyO') { toggleSound(); return; }
  const first = !G.keys[ev.code];
  G.keys[ev.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(ev.code)) ev.preventDefault();
  if (!first) return;
  if (coreLoadedCount < totalCoreAssets && G.time <= 8) return;
  if (G.screen === 'title' && (ev.code === 'Space' || ev.code === 'Enter')) {
    resetFullGame(); playSfx('sfx_coin');
    startStoryScene('l1_intro', () => { G.screen = 'play'; playSfx('sfx_win'); });
    return;
  }
  if (G.screen === 'story') {
    if (ev.code === 'Escape') { if (G.story.logOpen) G.story.logOpen = false; else skipStoryScene(); return; }
    if (ev.code === 'KeyL') { G.story.logOpen = !G.story.logOpen; return; }
    if (ev.code === 'Digit1' || ev.code === 'Numpad1') { chooseStoryOption(0); return; }
    if (ev.code === 'Digit2' || ev.code === 'Numpad2') { chooseStoryOption(1); return; }
    if (ev.code === 'Space' || ev.code === 'Enter') { advanceStory(); return; }
    return;
  }
  if (G.screen === 'intro' && (ev.code === 'Space' || ev.code === 'Enter')) { G.screen = 'play'; playSfx('sfx_win'); return; }
  if (G.screen === 'gameover') {
    if (ev.code === 'Space' || ev.code === 'Enter' || ev.code === 'KeyR') {
      // Retry level keeps upgrades & coins!
      G.hp = G.maxHp; G.ayran = G.maxAyran;
      setupLevel(G.levelIdx); G.screen = 'play'; return;
    } else if (ev.code === 'Escape') {
      resetFullGame(); G.screen = 'title'; return;
    }
  }
  if (G.screen === 'victory' && (ev.code === 'Space' || ev.code === 'Enter')) {
    resetFullGame(); G.screen = 'title'; return;
  }
  if (G.screen === 'pause' && (ev.code === 'Escape' || ev.code === 'KeyP')) { G.screen = 'play'; return; }
  if (G.screen === 'shop' && (ev.code === 'Escape' || ev.code === 'KeyM')) {
    if (G.bossDefeated) {
      setupLevel(G.levelIdx + 1);
      const nextScene = G.levelIdx === 1 ? 'l2_intro' : 'l3_intro';
      startStoryScene(nextScene, () => { G.screen = 'play'; playSfx('sfx_win'); });
    } else G.screen = 'play';
    return;
  }
  if (G.screen === 'play') {
    if (ev.code === 'Space' || ev.code === 'KeyW' || ev.code === 'ArrowUp') { G.jumpBufT = 0.12; executeJump(); }
    else if (ev.code === 'KeyS' || ev.code === 'ArrowDown') { if (G.onPlatform) { G.dropThroughT = 0.24; G.onGround = false; G.onPlatform = false; G.pvy = 120; } }
    else if (ev.code === 'KeyJ') fireAyran(null);
    else if (ev.code === 'KeyK') useKolonya();
    else if (ev.code === 'KeyQ') useMegaNazar();
    else if (ev.code === 'KeyM') tryOpenShop();
    else if (ev.code === 'Escape' || ev.code === 'KeyP') G.screen = 'pause';
  }
});
window.addEventListener('keyup', ev => { G.keys[ev.code] = false; });

function lerpRgbColor(c1, c2, t) {
  const k = Math.max(0, Math.min(1, t));
  const r = Math.round(c1[0] + (c2[0] - c1[0]) * k);
  const g = Math.round(c1[1] + (c2[1] - c1[1]) * k);
  const b = Math.round(c1[2] + (c2[2] - c1[2]) * k);
  return `rgb(${r},${g},${b})`;
}

function drawLoadingScreen(fadeAlpha = 1, overridePct = null) {
  const pct = Math.max(0, Math.min(1, overridePct !== null ? overridePct : loadDisplayPct));
  const cx = VW / 2;
  const t = G.time || 0;
  const imgReady = id => images[id] && images[id].complete && images[id].naturalWidth > 0;

  ctx.save();
  ctx.globalAlpha = fadeAlpha;

  // 1. Dynamic Cooling Backdrop (45°C summer crimson/amber -> user mockup deep icy Aegean teal)
  const bgTop = lerpRgbColor([38, 16, 36], [10, 59, 82], pct);
  const bgMid = lerpRgbColor([99, 34, 48], [19, 91, 120], pct);
  const bgBot = lerpRgbColor([168, 68, 36], [27, 120, 152], pct);
  const grad = ctx.createLinearGradient(0, 0, 0, VH);
  grad.addColorStop(0, bgTop);
  grad.addColorStop(0.52, bgMid);
  grad.addColorStop(1, bgBot);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, VW, VH);

  // Slow-rotating radial comic sun/frost rays centered behind bottle
  ctx.save();
  ctx.translate(cx - 4, 315);
  ctx.rotate(t * 0.12);
  ctx.fillStyle = pct >= 0.65 ? 'rgba(138, 240, 255, 0.085)' : 'rgba(255, 220, 145, 0.065)';
  const rayCount = 14;
  for (let i = 0; i < rayCount; i++) {
    const a0 = (i / rayCount) * Math.PI * 2;
    const a1 = a0 + (Math.PI / rayCount) * 0.72;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, Math.max(VW, VH) * 0.78, a0, a1);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // Soft radial centerpiece halo
  const haloGrad = ctx.createRadialGradient(cx, 315, 24, cx, 315, 310);
  haloGrad.addColorStop(0, pct >= 0.6 ? 'rgba(95, 232, 255, 0.25)' : 'rgba(255, 162, 74, 0.19)');
  haloGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = haloGrad;
  ctx.fillRect(cx - 340, 30, 680, 560);

  // Subtle floating icy frost specks appearing smoothly as liquid chills past 35%
  if (pct > 0.35) {
    const frostA = Math.min(1, (pct - 0.35) / 0.55);
    ctx.save();
    for (let si = 0; si < 34; si++) {
      const fx = ((si * 173 + t * (10 + (si % 4) * 5)) % (VW + 40)) - 20;
      const fy = ((si * 97 + t * (18 + (si % 3) * 8)) % (VH + 20)) - 10;
      const fr = 1.3 + (si % 3) * 0.9;
      ctx.globalAlpha = fadeAlpha * frostA * (0.22 + (si % 4) * 0.11);
      ctx.fillStyle = si % 3 === 0 ? '#bff8ff' : '#ffffff';
      ctx.beginPath(); ctx.arc(fx, fy, fr, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // 2. Header: Hand-painted icicle logo + SON AYRANCI badge (with crisp fallbacks)
  if (imgReady('load_logo')) {
    const im = images.load_logo;
    const lh = 66;
    const lw = Math.round(im.naturalWidth * (lh / im.naturalHeight));
    ctx.drawImage(im, cx - lw / 2, 36, lw, lh);
  } else {
    drawOutlined('BUZ GİBİ KIYAMET', cx, 68, 42, '#7ef0ff');
  }

  if (imgReady('load_badge_ayranci')) {
    const im = images.load_badge_ayranci;
    const bh = 40;
    const bw = Math.round(im.naturalWidth * (bh / im.naturalHeight));
    ctx.drawImage(im, cx - bw / 2, 110, bw, bh);
  } else {
    fillRectR(cx - 88, 112, 176, 32, 16, 'rgba(18, 22, 42, 0.9)');
    strokeRectR(cx - 88, 112, 176, 32, 16, '#ffe46b', 2.5);
    drawOutlined('SON AYRANCI', cx, 128, 16, '#ffe46b');
  }

  // 3A. 8-Frame Native RGBA Hand-Painted Ayran Bottle Sprite Sheet + Glowing Dashed Halo Ring & Stars
  const isFull = pct >= 0.995;
  const BOTTLE_FRAMES = 8;
  const frameIdx = pct < 0.05 ? 0
    : pct < 0.22 ? 1
    : pct < 0.40 ? 2
    : pct < 0.56 ? 3
    : pct < 0.68 ? 4
    : pct < 0.80 ? 5
    : pct < 0.94 ? 6 : 7;
  const cellW = imgReady('load_bottle_sheet') ? (images.load_bottle_sheet.naturalWidth / BOTTLE_FRAMES) : 168;
  const cellH = imgReady('load_bottle_sheet') ? images.load_bottle_sheet.naturalHeight : 344;
  const popScale = isFull ? (1 + 0.045 * Math.sin(t * 12)) : 1;
  const pourTilt = (!isFull && pct > 0.02) ? Math.sin(t * 4.2) * 0.018 : 0;
  const bH = 294;
  const bW = Math.round(bH * (cellW / cellH));
  const bcx = cx - 10;
  const bx = bcx - bW / 2;
  const by = 166;
  const bcy = by + bH * 0.52;

  // Rotating dashed glow halo + twinkling 4-point comic stars behind bottle (grows with pct)
  const haloAlpha = 0.25 + 0.75 * pct;
  ctx.save();
  ctx.translate(bcx, bcy + 4);
  ctx.globalAlpha = fadeAlpha * haloAlpha;
  const ringR = 136 + (isFull ? Math.sin(t * 7) * 4 : 0);
  ctx.strokeStyle = pct >= 0.7 ? 'rgba(235, 252, 255, 0.85)' : 'rgba(255, 225, 165, 0.65)';
  ctx.lineWidth = 3.2;
  ctx.setLineDash([9, 11]);
  ctx.beginPath(); ctx.arc(0, 0, ringR, t * 0.85, t * 0.85 + Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);

  const starCount = pct > 0.2 ? (isFull ? 10 : 6) : 3;
  for (let si = 0; si < starCount; si++) {
    const ang = t * 0.45 + (si * Math.PI * 2) / starCount;
    const dist = ringR + (si % 2 === 0 ? 12 : -10);
    const sx = Math.cos(ang) * dist;
    const sy = Math.sin(ang) * dist;
    const spR = (si % 3 === 0 ? 9 : 6) + Math.sin(t * 8 + si * 1.3) * 2.2;
    ctx.fillStyle = si % 2 === 0 ? '#ffe45e' : '#8ef4ff';
    ctx.beginPath();
    ctx.moveTo(sx, sy - spR);
    ctx.lineTo(sx + spR * 0.30, sy - spR * 0.30);
    ctx.lineTo(sx + spR, sy);
    ctx.lineTo(sx + spR * 0.30, sy + spR * 0.30);
    ctx.lineTo(sx, sy + spR);
    ctx.lineTo(sx - spR * 0.30, sy + spR * 0.30);
    ctx.lineTo(sx - spR, sy);
    ctx.lineTo(sx - spR * 0.30, sy - spR * 0.30);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // Rising chill vapor wisps around neck when chilled
  if (pct > 0.45) {
    const chillA = Math.min(1, (pct - 0.45) / 0.55);
    for (let vi = 0; vi < 5; vi++) {
      const vp = ((t * 0.5 + vi * 0.21) % 1);
      const vx = bcx + Math.sin(vp * 6 + vi * 1.5) * 32 + (vi % 2 === 0 ? -38 : 38);
      const vy = by + bH * 0.45 - vp * 135;
      ctx.save();
      ctx.globalAlpha = fadeAlpha * chillA * (1 - vp) * 0.24;
      ctx.fillStyle = '#bff8ff';
      ctx.beginPath(); ctx.arc(vx, vy, 7 + vp * 14, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  // Soft grounded shadow below bottle (stays steady under tilt/pop)
  ctx.save();
  ctx.fillStyle = 'rgba(8, 12, 22, 0.38)';
  ctx.beginPath(); ctx.ellipse(bcx, by + bH + 3, bW * 0.42, 9, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(bcx, by + bH * 0.88);
  ctx.rotate(pourTilt);
  ctx.scale(popScale, popScale);
  ctx.translate(-bcx, -(by + bH * 0.88));

  if (imgReady('load_bottle_sheet')) {
    ctx.drawImage(
      images.load_bottle_sheet,
      frameIdx * cellW, 0, cellW, cellH,
      bx, by, bW, bH
    );
  } else {
    // Minimal procedural fallback only during initial frame
    fillRectR(bx, by, bW, bH, 24, 'rgba(215, 245, 255, 0.28)');
    strokeRectR(bx, by, bW, bH, 24, '#141022', 4);
  }
  ctx.restore();

  // 3B. Animated Native Hollow RGBA Thermometer Shell (T1: live mercury tucked behind opaque rim)
  const thH = 268;
  const thW = imgReady('load_thermo_shell')
    ? Math.round(images.load_thermo_shell.naturalWidth * (thH / images.load_thermo_shell.naturalHeight))
    : 75;
  const tx = cx + 110;
  const thX = tx - thW / 2;
  const thY = 178;
  const tempVal = Math.round(45 - 41 * pct);
  const mercCol = pct < 0.5
    ? lerpRgbColor([255, 74, 58], [255, 171, 56], pct * 2)
    : lerpRgbColor([255, 171, 56], [78, 230, 255], (pct - 0.5) * 2);
  const txtCol = pct < 0.5
    ? lerpRgbColor([255, 102, 86], [255, 208, 98], pct * 2)
    : lerpRgbColor([255, 208, 98], [136, 242, 255], (pct - 0.5) * 2);

  const tubeL = thX + thW * 0.295;
  const tubeR = thX + thW * 0.705;
  const tubeW = tubeR - tubeL;
  const tubeTop = thY + thH * 0.048;
  const bulbCX = thX + thW * 0.497;
  const bulbCY = thY + thH * 0.857;
  const bulbRX = thW * 0.405;
  const bulbRY = thH * 0.108;

  // 1) Dark translucent empty-glass backing behind mercury cavity
  ctx.save();
  ctx.beginPath();
  roundRect(tubeL, tubeTop, tubeW, bulbCY - tubeTop, tubeW * 0.5);
  ctx.fillStyle = 'rgba(10, 22, 38, 0.56)';
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(bulbCX, bulbCY, bulbRX, bulbRY, 0, 0, Math.PI * 2);
  ctx.fill();

  // 2) Live shaded mercury column & bulb ellipse (drops smoothly from 45°C top to 4°C midpoint)
  const mercFrac = 0.88 - pct * 0.44;
  const colSpan = bulbCY - tubeTop;
  const mercTopY = bulbCY - colSpan * mercFrac;
  ctx.fillStyle = mercCol;
  ctx.beginPath();
  roundRect(tubeL + 1, mercTopY, tubeW - 2, bulbCY - mercTopY + 3, (tubeW - 2) * 0.45);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(bulbCX, bulbCY, bulbRX - 1, bulbRY - 1, 0, 0, Math.PI * 2);
  ctx.fill();

  // Subtle glossy cylinder sheen on mercury column & bulb core
  const cylSheen = ctx.createLinearGradient(tubeL, 0, tubeR, 0);
  cylSheen.addColorStop(0, 'rgba(255, 255, 255, 0.28)');
  cylSheen.addColorStop(0.35, 'rgba(255, 255, 255, 0.12)');
  cylSheen.addColorStop(1, 'rgba(0, 12, 28, 0.18)');
  ctx.fillStyle = cylSheen;
  ctx.beginPath();
  roundRect(tubeL + 1, mercTopY, tubeW - 2, bulbCY - mercTopY + 3, (tubeW - 2) * 0.45);
  ctx.fill();
  const bulbGlow = ctx.createRadialGradient(bulbCX - bulbRX * 0.22, bulbCY - bulbRY * 0.25, 1, bulbCX, bulbCY, Math.max(bulbRX, bulbRY));
  bulbGlow.addColorStop(0, 'rgba(255, 255, 255, 0.30)');
  bulbGlow.addColorStop(0.55, 'rgba(255, 255, 255, 0)');
  bulbGlow.addColorStop(1, 'rgba(0, 10, 26, 0.18)');
  ctx.fillStyle = bulbGlow;
  ctx.beginPath();
  ctx.ellipse(bulbCX, bulbCY, bulbRX - 1, bulbRY - 1, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 3) Draw opaque-bezel native RGBA thermometer shell ON TOP of mercury
  if (imgReady('load_thermo_shell')) {
    ctx.drawImage(images.load_thermo_shell, thX, thY, thW, thH);
  } else {
    strokeRectR(tubeL - 3, tubeTop - 3, tubeW + 6, colSpan + 10, 12, '#141022', 4);
  }

  // 4) Crisp comic scale ticks cleanly outside left tube outline
  ctx.save();
  const tickX = thX + thW * 0.194;
  ctx.lineCap = 'round';
  for (let ti = 0; ti < 6; ti++) {
    const ty = tubeTop + 20 + ti * ((bulbCY - bulbRY - tubeTop - 28) / 5);
    const tLen = (ti % 2 === 0 ? 10 : 7);
    ctx.strokeStyle = '#0a1a32';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(tickX - 3, ty); ctx.lineTo(tickX - tLen, ty); ctx.stroke();
    ctx.strokeStyle = '#d8f6ff';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(tickX - 3, ty); ctx.lineTo(tickX - tLen, ty); ctx.stroke();
  }
  ctx.restore();

  // 3C. Temperature Readout & Hand-Painted Frosted BUZ GİBİ! Badge beside thermometer
  const infoX = tx + 124;
  const shakeX = pct < 0.2 ? Math.sin(t * 42) * 1.8 : 0;
  drawOutlined(`${tempVal}°C`, infoX + shakeX, 272, 46, txtCol);

  if (pct >= 0.85 && imgReady('load_badge_ice')) {
    const im = images.load_badge_ice;
    const popK = Math.min(1, (pct - 0.85) / 0.15);
    const spring = 0.85 + 0.15 * Math.sin(popK * Math.PI * 0.5) + (isFull ? Math.sin(t * 8) * 0.02 : 0);
    const iw = Math.round(168 * spring);
    const ih = Math.round(iw * (im.naturalHeight / im.naturalWidth));
    ctx.drawImage(im, infoX - iw / 2, 302, iw, ih);
  } else {
    const isHot = pct < 0.25;
    const statusText = pct >= 0.85 ? 'BUZ GİBİ!' : (isHot ? 'HARARET KRİTİK!' : 'SOĞUYOR...');
    const statusCol = pct >= 0.85 ? '#8ef4ff' : (isHot ? '#ff7c68' : '#ffd86b');
    drawOutlined(statusText, infoX, 322, 17, statusCol);
  }

  // 4. Hand-Painted Forged Iron Scroll-Bracketed Progress Bar (y = 486)
  const barW = Math.min(580, VW - 160);
  const barH = imgReady('load_bar_frame')
    ? Math.round(barW * (images.load_bar_frame.naturalHeight / images.load_bar_frame.naturalWidth))
    : 64;
  const barX = cx - barW / 2;
  const barY = 486;

  // Calibrated inner slot coords with tiny overlap tuck cleanly behind iron frame
  const slotX = barX + barW * 0.040;
  const slotW = barW * (0.960 - 0.040);
  const slotY = barY + barH * 0.328;
  const slotH = barH * (0.655 - 0.328);

  fillRectR(slotX, slotY, slotW, slotH, slotH * 0.45, '#0c1320');
  if (pct > 0.015) {
    const fillW = Math.max(16, slotW * pct);
    ctx.save();
    roundRect(slotX, slotY, fillW, slotH, slotH * 0.45);
    ctx.clip();
    const fillG = ctx.createLinearGradient(slotX, slotY, slotX + slotW, slotY);
    fillG.addColorStop(0, '#ff8e2b');
    fillG.addColorStop(0.55, '#ffca57');
    fillG.addColorStop(1, '#4ce6ff');
    ctx.fillStyle = fillG;
    ctx.fillRect(slotX, slotY, fillW, slotH);

    // Animated diagonal white sheen sweep
    const sheenX = slotX - 70 + ((t * 240) % (slotW + 140));
    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
    ctx.beginPath();
    ctx.moveTo(sheenX, slotY - 4);
    ctx.lineTo(sheenX + 34, slotY - 4);
    ctx.lineTo(sheenX + 14, slotY + slotH + 4);
    ctx.lineTo(sheenX - 20, slotY + slotH + 4);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  if (imgReady('load_bar_frame')) {
    ctx.drawImage(images.load_bar_frame, barX, barY, barW, barH);
  } else {
    strokeRectR(slotX, slotY, slotW, slotH, 12, '#7ef0ff', 3);
  }
  drawOutlined(`${Math.round(pct * 100)}%`, cx, slotY + slotH * 0.52, 17, '#ffffff');

  // 5. Hand-Painted Forged Slate Tip Banner (y = 574)
  const TIPS = [
    'İPUCU: Önce Ayranla ıslat, sonra 80° Kolonya ile 1.9x KÖPÜK ŞOKU patlat!',
    'İPUCU: Simit arabasına veya tezgaha zıpla — yüksekten atış +%45 menzil verir!',
    'İPUCU: Kırmızı saldırı yayını görünce geri çekil veya tezgaha kaç!',
    'İPUCU: Mega Nazar önündeki 520 px koniyi dondurur — kalabalığa doğru dön!'
  ];
  const tipIdx = Math.floor(t / 2.2) % TIPS.length;
  const tipW = Math.min(720, VW - 96);
  const tipH = imgReady('load_tip_frame')
    ? Math.round(tipW * (images.load_tip_frame.naturalHeight / images.load_tip_frame.naturalWidth))
    : 74;
  const tipX = cx - tipW / 2;
  const tipY = 574;

  if (imgReady('load_tip_frame')) {
    ctx.drawImage(images.load_tip_frame, tipX, tipY, tipW, tipH);
  } else {
    fillRectR(tipX, tipY, tipW, tipH, 14, '#1b222c');
    strokeRectR(tipX, tipY, tipW, tipH, 14, '#5a6b80', 4);
  }
  ctx.font = '800 15px BalooBold, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#f2f8ff';
  ctx.fillText(TIPS[tipIdx], cx, tipY + tipH * 0.485, tipW * 0.85);

  ctx.restore();
}

let lastTs = performance.now();
function loop(ts) {
  const dt = Math.min(0.05, Math.max(0.001, (ts - lastTs) / 1000));
  G.dt = dt;
  lastTs = ts;
  G.time += dt;
  const rawPct = Math.min(1, coreLoadedCount / Math.max(1, totalCoreAssets));
  loadDisplayPct += (rawPct - loadDisplayPct) * Math.min(1, dt * 14);

  if (loadPreviewPct !== null) {
    G.zones = [];
    ctx.clearRect(0, 0, VW, VH);
    drawLoadingScreen(1, loadPreviewPct);
    requestAnimationFrame(loop);
    return;
  }

  const assetsReady = (coreLoadedCount >= totalCoreAssets && fontsReady) || G.time > 8;
  if (!assetsReady) {
    G.zones = [];
    ctx.clearRect(0, 0, VW, VH);
    drawLoadingScreen(1, loadDisplayPct);
    requestAnimationFrame(loop);
    return;
  }
  if (!loadDone) loadDone = true;

  if (G.screen === 'play') updatePlay(dt);
  else if (G.screen === 'story') updateStory(dt);

  BgmEngine.update();

  G.zones = [];
  ctx.clearRect(0, 0, VW, VH);
  if (G.screen === 'title') drawTitleScreen();
  else if (G.screen === 'story') drawStoryScreen();
  else if (G.screen === 'intro') drawComicIntro();
  else if (G.screen === 'play') { drawWorld(); drawHUD(); }
  else if (G.screen === 'shop') drawShopModal();
  else if (G.screen === 'pause') drawPauseModal();
  else if (G.screen === 'gameover') drawEndModal(false);
  else if (G.screen === 'victory') drawEndModal(true);

  if (loadFadeT < 0.32) {
    loadFadeT += dt;
    drawLoadingScreen(Math.max(0, 1 - loadFadeT / 0.32), 1);
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
